name: PR 656 Ruff Format

on:
  push:
    branches:
      - fix/643-installed-public-surface-20261002

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Format and commit provider contract tests
        shell: bash
        run: |
          set -euo pipefail
          uvx ruff==0.14.9 format tests/test_public_llm_provider_contract.py
          git diff --check
          if git diff --quiet -- tests/test_public_llm_provider_contract.py; then
            echo "File already formatted"
            exit 0
          fi
          git config user.name "Steven Zimmerman, CPA"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add tests/test_public_llm_provider_contract.py
          git commit -m "style: format public provider contract tests"
          git push origin HEAD:"$GITHUB_REF_NAME"
