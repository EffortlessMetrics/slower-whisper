name: Format Provenance 623

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: format-provenance-623
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout provenance branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/trusted-provenance-623
          fetch-depth: 0

      - name: Tighten fixtures and bounded attempt evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          receipt_path = Path("transcription/receipt.py")
          receipt = receipt_path.read_text(encoding="utf-8")
          if "import re\n" not in receipt.split("from collections.abc", 1)[0]:
              receipt = receipt.replace("import math\n", "import math\nimport re\n", 1)

          pattern_anchor = (
              '_BUILD_ID_PATTERN = r"^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"\n'
          )
          if "_REASON_CODE_PATTERN" not in receipt:
              assert receipt.count(pattern_anchor) == 1
              receipt = receipt.replace(
                  pattern_anchor,
                  pattern_anchor
                  + '_REASON_CODE_PATTERN = re.compile(r"^[a-z0-9_]+$")\n',
                  1,
              )

          attempt_anchor = '''        if attempt["outcome"] not in _ALLOWED_ATTEMPT_OUTCOMES:
            continue
        normalized.append(attempt)
'''
          attempt_replacement = '''        if attempt["outcome"] not in _ALLOWED_ATTEMPT_OUTCOMES:
            continue
        if _REASON_CODE_PATTERN.fullmatch(attempt["reason_code"]) is None:
            continue
        normalized.append(attempt)
'''
          if attempt_replacement not in receipt:
              assert receipt.count(attempt_anchor) == 1
              receipt = receipt.replace(attempt_anchor, attempt_replacement, 1)
          receipt = receipt.replace(
              '    import re\n    import uuid\n',
              '    import uuid\n',
              1,
          )
          receipt_path.write_text(receipt, encoding="utf-8")

          receipt_tests_path = Path("tests/test_receipt.py")
          receipt_tests = receipt_tests_path.read_text(encoding="utf-8")
          receipt_tests = receipt_tests.replace("abcd1234efgh", "abcd1234efab")
          if "test_invalid_model_load_reason_is_not_admitted_to_receipt" not in receipt_tests:
              receipt_tests += '''


def test_invalid_model_load_reason_is_not_admitted_to_receipt() -> None:
    receipt = build_receipt(
        model="tiny",
        device="cpu",
        compute_type="int8",
        model_load_attempts=[
            {
                "device": "cpu",
                "compute_type": "int8",
                "outcome": "selected",
                "reason_code": "contains a space",
            }
        ],
    )
    assert "model_load_attempts" not in receipt.to_dict()
'''
          receipt_tests_path.write_text(receipt_tests, encoding="utf-8")

          build_tests_path = Path("tests/test_build_info.py")
          build_tests = build_tests_path.read_text(encoding="utf-8")
          if "test_build_info_generator_without_identity_renders_valid_python" not in build_tests:
              unknown_test = '''


def test_build_info_generator_without_identity_renders_valid_python(
    tmp_path: Path,
) -> None:
    script = Path(__file__).resolve().parents[1] / "scripts" / "write_build_info.py"
    output = tmp_path / "unknown.py"
    subprocess.run(
        [sys.executable, str(script), "--output", str(output)],
        check=True,
    )
    source = output.read_text(encoding="utf-8")
    assert "SOURCE_COMMIT: str | None = None" in source
    assert "BUILD_ID: str | None = None" in source
    compile(source, str(output), "exec")
'''
              marker = "\n\n@pytest.mark.parametrize("
              assert build_tests.count(marker) == 1
              build_tests = build_tests.replace(marker, unknown_test + marker, 1)
          build_tests_path.write_text(build_tests, encoding="utf-8")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Apply canonical Ruff formatting
        run: |
          uvx ruff@0.14.14 format \
            scripts/write_build_info.py \
            transcription/_build_info.py \
            transcription/build_info.py \
            transcription/meta_utils.py \
            transcription/receipt.py \
            tests/test_build_info.py \
            tests/test_meta_utils.py \
            tests/test_provenance_schema.py \
            tests/test_provenance_surfaces.py \
            tests/test_receipt.py
          uvx ruff@0.14.14 check --fix \
            scripts/write_build_info.py \
            transcription/_build_info.py \
            transcription/build_info.py \
            transcription/meta_utils.py \
            transcription/receipt.py \
            tests/test_build_info.py \
            tests/test_meta_utils.py \
            tests/test_provenance_schema.py \
            tests/test_provenance_surfaces.py \
            tests/test_receipt.py
          uvx ruff@0.14.14 format \
            scripts/write_build_info.py \
            transcription/_build_info.py \
            transcription/build_info.py \
            transcription/meta_utils.py \
            transcription/receipt.py \
            tests/test_build_info.py \
            tests/test_meta_utils.py \
            tests/test_provenance_schema.py \
            tests/test_provenance_surfaces.py \
            tests/test_receipt.py
          git diff --check

      - name: Remove one-shot formatter and commit
        run: |
          rm .github/workflows/format-provenance-623.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "style: format trusted provenance and strict fixtures"
          git push origin HEAD:fix/trusted-provenance-623
