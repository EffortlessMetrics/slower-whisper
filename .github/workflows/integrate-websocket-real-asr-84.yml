name: Integrate WebSocket Real ASR 84

on:
  push:
    branches: [feature/websocket-real-asr-84]

permissions:
  contents: write

concurrency:
  group: integrate-websocket-real-asr-84
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout route branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/websocket-real-asr-84
          fetch-depth: 0

      - name: Replace the public route adapter and error boundary
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path("transcription/service_streaming.py")
          source = path.read_text(encoding="utf-8")

          source = source.replace(
              "from .streaming_asr import StreamingASRAdapter\n",
              "",
          )
          imports = (
              "from .exceptions import RuntimeNotReadyError, TranscriptionError\n"
              "from .streaming_revision_controller import RevisionStreamingController\n"
          )
          if "from .streaming_revision_controller import" not in source:
              tree = ast.parse(source)
              import_nodes = [
                  node
                  for node in tree.body
                  if isinstance(node, (ast.Import, ast.ImportFrom))
              ]
              insertion = max(node.end_lineno or node.lineno for node in import_nodes)
              lines = source.splitlines(keepends=True)
              lines.insert(insertion, imports)
              source = "".join(lines)

          tree = ast.parse(source, filename=str(path))
          route = next(
              node
              for node in tree.body
              if isinstance(node, ast.AsyncFunctionDef)
              and node.name == "websocket_stream"
          )

          session_assignment = None
          adapter_ranges: list[tuple[int, int]] = []
          for node in ast.walk(route):
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  value = node.value
                  if isinstance(value, ast.Call):
                      function = value.func
                      function_name = (
                          function.id
                          if isinstance(function, ast.Name)
                          else function.attr
                          if isinstance(function, ast.Attribute)
                          else None
                      )
                      if function_name == "WebSocketStreamingSession":
                          session_assignment = node
                      if function_name == "StreamingASRAdapter":
                          adapter_ranges.append(
                              (node.lineno, node.end_lineno or node.lineno)
                          )
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  for target in targets:
                      if (
                          isinstance(target, ast.Attribute)
                          and isinstance(target.value, ast.Name)
                          and target.value.id == "session"
                          and target.attr == "asr_adapter"
                      ):
                          adapter_ranges.append(
                              (node.lineno, node.end_lineno or node.lineno)
                          )

          assert session_assignment is not None, "public session constructor not found"
          lines = source.splitlines(keepends=True)
          for start, end in sorted(set(adapter_ranges), reverse=True):
              del lines[start - 1 : end]

          # Reparse after removals to recover the constructor's current line.
          source = "".join(lines)
          tree = ast.parse(source, filename=str(path))
          route = next(
              node
              for node in tree.body
              if isinstance(node, ast.AsyncFunctionDef)
              and node.name == "websocket_stream"
          )
          session_assignment = next(
              node
              for node in ast.walk(route)
              if isinstance(node, (ast.Assign, ast.AnnAssign))
              and isinstance(node.value, ast.Call)
              and (
                  (
                      isinstance(node.value.func, ast.Name)
                      and node.value.func.id == "WebSocketStreamingSession"
                  )
                  or (
                      isinstance(node.value.func, ast.Attribute)
                      and node.value.func.attr == "WebSocketStreamingSession"
                  )
              )
          )
          indent = " " * session_assignment.col_offset
          integration = (
              f"{indent}application = websocket.scope.get(\"app\")\n"
              f"{indent}runtime = getattr(\n"
              f"{indent}    getattr(application, \"state\", None),\n"
              f"{indent}    \"asr_runtime\",\n"
              f"{indent}    None,\n"
              f"{indent})\n"
              f"{indent}if runtime is None or not runtime.ready:\n"
              f"{indent}    error = RuntimeNotReadyError(\n"
              f"{indent}        \"The process-owned ASR runtime is not ready\",\n"
              f"{indent}        context={{\n"
              f"{indent}            \"state\": getattr(\n"
              f"{indent}                getattr(runtime, \"state\", None),\n"
              f"{indent}                \"value\",\n"
              f"{indent}                \"missing\",\n"
              f"{indent}            )\n"
              f"{indent}        }},\n"
              f"{indent}    )\n"
              f"{indent}    await session.send_event(\n"
              f"{indent}        EventType.ERROR,\n"
              f"{indent}        {{\n"
              f"{indent}            \"code\": error.reason_code,\n"
              f"{indent}            \"message\": \"Streaming ASR runtime is not ready\",\n"
              f"{indent}            \"recoverable\": False,\n"
              f"{indent}            \"context\": dict(error.context),\n"
              f"{indent}        }},\n"
              f"{indent}    )\n"
              f"{indent}    await websocket.close(code=1013)\n"
              f"{indent}    return\n"
              f"{indent}controller = RevisionStreamingController(session, runtime)\n"
          )
          lines = source.splitlines(keepends=True)
          insertion = session_assignment.end_lineno or session_assignment.lineno
          lines.insert(insertion, integration)
          source = "".join(lines)

          source = source.replace(
              "await session.handle_start_session(",
              "await controller.handle_start_session(",
          )
          source = source.replace(
              "await session.handle_end_session()",
              "await controller.handle_end_session()",
          )

          generic_anchor = "\n    except Exception as e:\n"
          assert source.count(generic_anchor) == 1, (
              "expected one outer generic route exception handler"
          )
          typed_handler = (
              "\n    except TranscriptionError as error:\n"
              "        logger.error(\n"
              "            \"Streaming ASR failed [%s]\",\n"
              "            error.reason_code,\n"
              "            exc_info=error,\n"
              "        )\n"
              "        if session.state is not SessionState.ERROR:\n"
              "            try:\n"
              "                await session.send_event(\n"
              "                    EventType.ERROR,\n"
              "                    {\n"
              "                        \"code\": error.reason_code,\n"
              "                        \"message\": \"Streaming ASR failed\",\n"
              "                        \"recoverable\": False,\n"
              "                        \"context\": dict(error.context),\n"
              "                    },\n"
              "                )\n"
              "            except Exception:\n"
              "                logger.debug(\n"
              "                    \"Failed to send terminal streaming ASR error\",\n"
              "                    exc_info=True,\n"
              "                )\n"
              "        try:\n"
              "            await websocket.close(code=1011)\n"
              "        except Exception:\n"
              "            logger.debug(\n"
              "                \"Failed to close WebSocket after ASR failure\",\n"
              "                exc_info=True,\n"
              "            )\n"
          )
          source = source.replace(generic_anchor, typed_handler + generic_anchor, 1)
          source = source.replace(
              '"message": str(e)',
              '"message": "Unexpected streaming failure"',
          )
          source = source.replace(
              '"message": f"Internal server error: {e}"',
              '"message": "Unexpected streaming failure"',
          )
          source = source.replace(
              '"message": f"Unexpected error: {e}"',
              '"message": "Unexpected streaming failure"',
          )

          assert "StreamingASRAdapter" not in source
          assert "controller.handle_start_session" in source
          assert "controller.handle_end_session" in source
          assert "RevisionStreamingController(session, runtime)" in source
          ast.parse(source, filename=str(path))
          path.write_text(source, encoding="utf-8")
          PY

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python
        run: uv python install 3.12

      - name: Install focused environment
        run: uv sync --frozen --python 3.12 --extra dev --extra api

      - name: Format and verify route integration
        run: |
          uv run ruff check --fix \
            transcription/service_streaming.py \
            transcription/streaming_revision_controller.py \
            transcription/streaming_runtime_asr.py \
            tests/test_streaming_revision_controller.py \
            tests/test_streaming_runtime_asr.py
          uv run ruff format \
            transcription/service_streaming.py \
            transcription/streaming_revision_controller.py \
            transcription/streaming_runtime_asr.py \
            tests/test_streaming_revision_controller.py \
            tests/test_streaming_runtime_asr.py
          uv run ruff check \
            transcription/service_streaming.py \
            transcription/streaming_revision_controller.py \
            transcription/streaming_runtime_asr.py \
            tests/test_streaming_revision_controller.py \
            tests/test_streaming_runtime_asr.py
          uv run mypy \
            transcription/streaming_revision_controller.py \
            transcription/streaming_runtime_asr.py
          uv run pytest -q \
            tests/test_streaming_revision_controller.py \
            tests/test_streaming_runtime_asr.py \
            tests/test_streaming_ws.py
          git diff --check

      - name: Remove diagnostics and commit the integrated route
        run: |
          rm -f .github/workflows/integrate-websocket-real-asr-84.yml
          rm -f .github/workflows/inspect-websocket-real-asr-84.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "streaming: replace the public placeholder ASR path"
          git push origin HEAD:feature/websocket-real-asr-84
