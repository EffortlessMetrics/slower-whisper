name: Repair ASR Recovery Type Contract

on:
  push:
    branches: [fix/asr-fail-closed-621]

permissions:
  contents: write

concurrency:
  group: repair-asr-622
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/asr-fail-closed-621
          fetch-depth: 0

      - name: Apply narrow type-check repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("transcription/asr_engine.py")
          source = path.read_text(encoding="utf-8")

          unavailable_old = '''            error = ASRUnavailableError(
                "The faster-whisper backend is unavailable",
                context={"backend": "faster-whisper"},
            )
            if _FASTER_WHISPER_IMPORT_ERROR is not None:
                raise error from _FASTER_WHISPER_IMPORT_ERROR
            raise error
'''
          unavailable_new = '''            unavailable_error = ASRUnavailableError(
                "The faster-whisper backend is unavailable",
                context={"backend": "faster-whisper"},
            )
            if _FASTER_WHISPER_IMPORT_ERROR is not None:
                raise unavailable_error from _FASTER_WHISPER_IMPORT_ERROR
            raise unavailable_error
'''

          load_old = '''        error = ASRModelLoadError(
            "The ASR model could not be loaded with any supported runtime configuration",
            context={
                "backend": "faster-whisper",
                "model": self.cfg.model_name,
                "attempts": [dict(attempt) for attempt in self.model_load_attempts],
            },
        )
        if last_error is not None:
            raise error from last_error
        raise error
'''
          load_new = '''        load_error = ASRModelLoadError(
            "The ASR model could not be loaded with any supported runtime configuration",
            context={
                "backend": "faster-whisper",
                "model": self.cfg.model_name,
                "attempts": [dict(attempt) for attempt in self.model_load_attempts],
            },
        )
        if last_error is not None:
            raise load_error from last_error
        raise load_error
'''

          assert source.count(unavailable_old) == 1, "unavailable block changed unexpectedly"
          assert source.count(load_old) == 1, "load block changed unexpectedly"
          path.write_text(
              source.replace(unavailable_old, unavailable_new, 1).replace(load_old, load_new, 1),
              encoding="utf-8",
          )
          PY
          git diff --check

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No repair required."
            exit 0
          fi
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -- transcription/asr_engine.py
          git commit -m "fix: keep typed ASR error locals distinct"
          git push origin HEAD:fix/asr-fail-closed-621
