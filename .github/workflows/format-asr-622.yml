name: Format ASR Recovery PR

on:
  push:
    branches: [fix/asr-fail-closed-621]

permissions:
  contents: write

concurrency:
  group: format-asr-622
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/asr-fail-closed-621
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Apply canonical Ruff formatting
        run: |
          uvx ruff@0.14.9 format \
            transcription/asr_engine.py \
            tests/test_asr_engine.py \
            tests/test_smoke_asr.py
          git diff --check

      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -- \
            transcription/asr_engine.py \
            tests/test_asr_engine.py \
            tests/test_smoke_asr.py
          git commit -m "style: apply canonical Ruff formatting"
          git push origin HEAD:fix/asr-fail-closed-621
