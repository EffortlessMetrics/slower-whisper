name: Diagnose WebSocket Test Order

on:
  pull_request:
    branches: [main]
    paths:
      - transcription/**
      - tests/test_incremental_asr.py
      - tests/test_public_streaming_real_asr.py
      - tests/test_streaming_revision_controller.py
      - tests/test_streaming_revision_edges.py
      - tests/test_streaming_runtime_asr.py
      - tests/test_websocket_real_asr_source_policy.py
      - tests/test_websocket_streaming.py
      - tests/test_streaming_ws.py
      - .github/workflows/diagnose-websocket-order.yml

permissions:
  contents: read

concurrency:
  group: diagnose-websocket-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-order:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install Python
        run: uv python install 3.12
      - name: Install environment
        run: uv sync --frozen --python 3.12 --extra dev --extra api
      - name: new stack without legacy session tests
        continue-on-error: true
        run: |
          uv run pytest -q --tb=short \
            tests/test_incremental_asr.py \
            tests/test_public_streaming_real_asr.py \
            tests/test_streaming_revision_controller.py \
            tests/test_streaming_revision_edges.py \
            tests/test_streaming_runtime_asr.py \
            tests/test_websocket_real_asr_source_policy.py \
            tests/test_websocket_streaming.py
      - name: public integration plus legacy session object
        continue-on-error: true
        run: |
          uv run pytest -q --tb=short \
            tests/test_websocket_streaming.py \
            tests/test_streaming_ws.py
      - name: public route plus public integration
        continue-on-error: true
        run: |
          uv run pytest -q --tb=short \
            tests/test_public_streaming_real_asr.py \
            tests/test_websocket_streaming.py
      - name: controller stack plus public integration
        continue-on-error: true
        run: |
          uv run pytest -q --tb=short \
            tests/test_streaming_revision_controller.py \
            tests/test_streaming_revision_edges.py \
            tests/test_streaming_runtime_asr.py \
            tests/test_websocket_streaming.py
      - name: all without public integration
        continue-on-error: true
        run: |
          uv run pytest -q --tb=short \
            tests/test_incremental_asr.py \
            tests/test_public_streaming_real_asr.py \
            tests/test_streaming_revision_controller.py \
            tests/test_streaming_revision_edges.py \
            tests/test_streaming_runtime_asr.py \
            tests/test_websocket_real_asr_source_policy.py \
            tests/test_streaming_ws.py
      - name: exact focused list in reverse order
        continue-on-error: true
        run: |
          uv run pytest -q --tb=short \
            tests/test_streaming_ws.py \
            tests/test_websocket_streaming.py \
            tests/test_websocket_real_asr_source_policy.py \
            tests/test_streaming_runtime_asr.py \
            tests/test_streaming_revision_edges.py \
            tests/test_streaming_revision_controller.py \
            tests/test_public_streaming_real_asr.py \
            tests/test_incremental_asr.py
      - name: exact focused list
        continue-on-error: true
        run: |
          uv run pytest -q --tb=short \
            tests/test_incremental_asr.py \
            tests/test_public_streaming_real_asr.py \
            tests/test_streaming_revision_controller.py \
            tests/test_streaming_revision_edges.py \
            tests/test_streaming_runtime_asr.py \
            tests/test_websocket_real_asr_source_policy.py \
            tests/test_websocket_streaming.py \
            tests/test_streaming_ws.py
