name: Show Surface Parity Format

on:
  pull_request:
    branches: [main]
    paths:
      - tests/test_surface_parity.py
      - .github/workflows/show-surface-parity-format.yml

permissions:
  contents: read

concurrency:
  group: show-surface-parity-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  show-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Print exact Ruff diff
        run: uvx ruff@0.14.14 format --diff tests/test_surface_parity.py
