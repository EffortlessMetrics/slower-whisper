name: CI
true:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      benchmark_gate:
        description: Run benchmarks in gate mode (fail on regression)
        required: false
        default: 'false'
        type: boolean
      benchmark_track:
        description: Benchmark track to run (asr, diarization, streaming, semantic,
          emotion, all)
        required: false
        default: asr
        type: choice
        options:
        - asr
        - diarization
        - streaming
        - semantic
        - emotion
        - all
  schedule:
  - cron: 0 2 * * 0
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint (ruff check)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python
      run: uv python install 3.12
    - name: Install dependencies
      run: uv sync --no-dev
    - name: Run ruff check
      run: uvx ruff@0.14.9 check transcription/ tests/ examples/ benchmarks/
  format:
    name: Format check (ruff format)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python
      run: uv python install 3.12
    - name: Check formatting
      run: uvx ruff@0.14.9 format --check transcription/ tests/ examples/ benchmarks/
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python
      run: uv python install 3.12
    - name: Install dependencies
      run: uv sync --extra api --extra dev
    - name: Run mypy
      run: "uv run mypy transcription/ slower_whisper/ \\\n  tests/test_llm_utils.py\
        \ \\\n  tests/test_writers.py \\\n  tests/test_turn_helpers.py \\\n  tests/test_audio_state_schema.py\n"
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v1.6.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python
      run: uv python install 3.12
    - name: Install security dependencies
      run: uv sync --extra security
    - name: Run pip-audit
      run: uv run pip-audit --strict --desc on
      continue-on-error: true
    - name: Run bandit
      run: uv run bandit -r transcription/ slower_whisper/ -ll
      continue-on-error: true
    - name: PII pattern scan
      run: "# Scan docs/examples/benchmarks for PII-like patterns\nFAIL=0\nfor dir\
        \ in docs examples benchmarks; do\n  [ -d \"$dir\" ] || continue\n  HITS=$(grep\
        \ -rPn '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}' \"$dir\" \\\n   \
        \ --include='*.md' --include='*.py' --include='*.json' --include='*.txt' \\\
        \n    | grep -v 'example\\.com' | grep -v '@example\\.' | grep -v 'test\\\
        .org' \\\n    | grep -v 'noreply@' | grep -v 'REDACTED' || true)\n  if [ -n\
        \ \"$HITS\" ]; then\n    echo \"::warning::Potential email PII in $dir:\"\n\
        \    echo \"$HITS\"\n    FAIL=1\n  fi\ndone\n[ \"$FAIL\" -eq 0 ] || echo \"\
        ::warning::Review PII hits above. Add to allowlist if intentional.\"\n"
  wheel-smoke:
    name: Wheel smoke test
    runs-on: ubuntu-latest
    needs:
    - lint
    - format
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Set up Python
      run: uv python install 3.12
    - name: Build wheel
      run: uv build
    - name: Install wheel in clean environment
      run: 'uv venv .venv-smoke

        .venv-smoke/bin/pip install dist/*.whl

        '
    - name: Verify slower_whisper import (installed wheel)
      run: 'cd /tmp

        "$GITHUB_WORKSPACE/.venv-smoke/bin/python" - <<''PY''

        import slower_whisper

        p = slower_whisper.__file__

        print("slower_whisper.__file__ =", p)

        assert "site-packages" in p, "Imported from source tree; wheel smoke invalid"


        from slower_whisper import WhisperModel, Segment, Word, TranscriptionInfo

        print(''WhisperModel:'', WhisperModel)

        print(''Segment:'', Segment)

        print(''Word:'', Word)

        print(''TranscriptionInfo:'', TranscriptionInfo)

        print(''All exports verified!'')

        PY

        '
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install system dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg libsndfile1

        '
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Run tests with coverage
      run: "uv run pytest \\\n  --cov=transcription \\\n  --cov-report=xml \\\n  --cov-report=term-missing\
        \ \\\n  -v \\\n  -m \"not slow and not heavy and not smoke and not e2e\" \\\
        \n  -n auto\n"
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: matrix.python-version == '3.12'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  test-smoke:
    name: Smoke tests (real tiny model)
    runs-on: ubuntu-latest
    needs:
    - lint
    - format
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python
      run: uv python install 3.12
    - name: Install system dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg libsndfile1

        '
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Restore HuggingFace cache
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/huggingface
        key: hf-smoke-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: 'hf-smoke-${{ runner.os }}-

          hf-${{ runner.os }}-

          '
    - name: Run smoke tests (real tiny model)
      env:
        SLOWER_WHISPER_TEST_REAL: '1'
      run: 'uv run pytest -m smoke --timeout=120 -v --tb=short -x

        '
    - name: Save HuggingFace cache
      if: always()
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/huggingface
        key: hf-smoke-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
  test-heavy:
    name: Heavy tests (emotion models)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python
      run: uv python install 3.12
    - name: Install system dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg libsndfile1

        '
    - name: Install dependencies with emotion extras
      run: uv sync --extra emotion
    - name: Install test dependencies
      run: uv pip install pytest pytest-mock
    - name: Restore HuggingFace cache
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/huggingface
        key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: 'hf-${{ runner.os }}-

          '
    - name: Run heavy tests
      run: "uv run pytest \\\n  -v \\\n  -m \"heavy\" \\\n  --tb=short\n"
      continue-on-error: ${{ github.event_name == 'pull_request' }}
    - name: Save HuggingFace cache
      if: always()
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/huggingface
        key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs:
    - lint
    - format
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python
      run: uv python install 3.12
    - name: Install system dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg libsndfile1

        '
    - name: Install dependencies
      run: uv sync --extra api --extra dev
    - name: Run integration tests
      run: 'uv run pytest tests/test_*integration*.py -v --tb=short

        '
  bdd-library:
    name: BDD Library Contract (behavioral)
    runs-on: ubuntu-latest
    needs:
    - lint
    - format
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python
      run: uv python install 3.12
    - name: Install system dependencies (ffmpeg required for BDD)
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg libsndfile1

        '
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Run library BDD scenarios
      run: 'uv run pytest tests/steps/ -v -m "not slow and not requires_gpu" --tb=short

        '
    - name: Upload BDD results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: bdd-library-results
        path: .pytest_cache/
  bdd-api:
    name: BDD API Contract (REST service)
    runs-on: ubuntu-latest
    needs:
    - lint
    - format
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python
      run: uv python install 3.12
    - name: Install system dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg libsndfile1

        '
    - name: Install dependencies (with API deps)
      run: uv sync --extra api --extra dev
    - name: Run API BDD scenarios (smoke tests - hard gate)
      run: 'uv run pytest features/ -v -m "api and smoke" --tb=short

        '
    - name: Run API BDD scenarios (functional tests)
      run: 'uv run pytest features/ -v -m "api and functional" --tb=short

        '
      continue-on-error: true
    - name: Upload API BDD results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: bdd-api-results
        path: .pytest_cache/
  benchmark:
    name: Benchmark (smoke test)
    runs-on: ubuntu-latest
    needs:
    - lint
    - format
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python
      run: uv python install 3.12
    - name: Install system dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg libsndfile1

        '
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Create benchmark results directory
      run: mkdir -p benchmark-results
    - name: Show benchmark infrastructure status
      run: 'uv run slower-whisper benchmark status

        '
    - name: List available benchmarks and baselines
      run: 'uv run slower-whisper benchmark list

        echo ""

        uv run slower-whisper benchmark baselines

        '
    - name: Run ASR benchmark smoke test (synthetic)
      id: benchmark-asr
      continue-on-error: true
      run: "# Generate a small synthetic test file for smoke testing\n# This tests\
        \ the benchmark infrastructure without requiring large datasets\npython -c\
        \ \"\nimport numpy as np\nimport wave\nimport os\n\n# Create a 2-second silent\
        \ WAV file for infrastructure smoke test\nsample_rate = 16000\nduration =\
        \ 2.0\nsamples = int(sample_rate * duration)\naudio_data = np.zeros(samples,\
        \ dtype=np.int16)\n\nos.makedirs('benchmark-results/smoke-data', exist_ok=True)\n\
        with wave.open('benchmark-results/smoke-data/test.wav', 'w') as wav:\n   \
        \ wav.setnchannels(1)\n    wav.setsampwidth(2)\n    wav.setframerate(sample_rate)\n\
        \    wav.writeframes(audio_data.tobytes())\nprint('Created synthetic test\
        \ audio for smoke test')\n\"\n\n# Test that benchmark CLI is functional\n\
        echo \"Testing benchmark CLI functionality...\"\nuv run slower-whisper benchmark\
        \ --help > benchmark-results/benchmark-help.txt\nuv run slower-whisper benchmark\
        \ run --help >> benchmark-results/benchmark-help.txt\n\n# Record benchmark\
        \ infrastructure test results\necho '{\"test\": \"benchmark_cli_smoke\", \"\
        status\": \"passed\", \"timestamp\": \"'$(date -Iseconds)'\"}' > benchmark-results/smoke-test.json\n\
        echo \"Benchmark infrastructure smoke test completed\"\n"
    - name: Check baseline files exist
      run: "echo \"Checking baseline files in benchmarks/baselines/...\"\nls -la benchmarks/baselines/\
        \ || echo \"No baselines directory\"\nfind benchmarks/baselines -name \"*.json\"\
        \ -type f 2>/dev/null | head -20 || echo \"No baseline files found\"\n\n#\
        \ Validate baseline JSON format\necho \"\"\necho \"Validating baseline file\
        \ formats...\"\nfor f in benchmarks/baselines/*/*.json; do\n  if [ -f \"$f\"\
        \ ]; then\n    echo \"Checking $f...\"\n    python -c \"import json; json.load(open('$f'))\"\
        \ && echo \"  Valid JSON\" || echo \"  INVALID JSON\"\n  fi\ndone\n"
    - name: Generate benchmark summary
      if: always()
      run: "echo \"## Benchmark Summary\" > benchmark-results/SUMMARY.md\necho \"\"\
        \ >> benchmark-results/SUMMARY.md\necho \"**Run Date:** $(date -Iseconds)\"\
        \ >> benchmark-results/SUMMARY.md\necho \"**Commit:** ${{ github.sha }}\"\
        \ >> benchmark-results/SUMMARY.md\necho \"**Branch:** ${{ github.ref_name\
        \ }}\" >> benchmark-results/SUMMARY.md\necho \"\" >> benchmark-results/SUMMARY.md\n\
        \necho \"### Infrastructure Status\" >> benchmark-results/SUMMARY.md\nuv run\
        \ slower-whisper benchmark status >> benchmark-results/SUMMARY.md 2>&1 ||\
        \ true\necho \"\" >> benchmark-results/SUMMARY.md\n\necho \"### Baseline Files\"\
        \ >> benchmark-results/SUMMARY.md\necho '```' >> benchmark-results/SUMMARY.md\n\
        find benchmarks/baselines -name \"*.json\" -type f 2>/dev/null || echo \"\
        No baselines found\"\necho '```' >> benchmark-results/SUMMARY.md\n\necho \"\
        \" >> benchmark-results/SUMMARY.md\necho \"### Smoke Test Result\" >> benchmark-results/SUMMARY.md\n\
        if [ -f \"benchmark-results/smoke-test.json\" ]; then\n  echo '```json' >>\
        \ benchmark-results/SUMMARY.md\n  cat benchmark-results/smoke-test.json >>\
        \ benchmark-results/SUMMARY.md\n  echo '```' >> benchmark-results/SUMMARY.md\n\
        else\n  echo \"Smoke test did not complete\" >> benchmark-results/SUMMARY.md\n\
        fi\n\ncat benchmark-results/SUMMARY.md\n"
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: benchmark-results
        path: benchmark-results/
        retention-days: 30
  benchmark-gate:
    name: Benchmark (gate mode)
    runs-on: ubuntu-latest
    if: 'github.event_name == ''schedule'' ||

      (github.event_name == ''workflow_dispatch'' && inputs.benchmark_gate == ''true'')
      ||

      (github.event_name == ''push'' && github.ref == ''refs/heads/main'')

      '
    needs:
    - lint
    - format
    - test
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python
      run: uv python install 3.12
    - name: Install system dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg libsndfile1

        '
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Restore benchmark cache
      uses: actions/cache/restore@v5
      with:
        path: '~/.cache/huggingface

          benchmarks/.cache

          '
        key: benchmark-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: 'benchmark-${{ runner.os }}-

          '
    - name: Create benchmark results directory
      run: mkdir -p benchmark-results
    - name: Determine benchmark track
      id: track
      run: "if [ \"${{ github.event_name }}\" == \"workflow_dispatch\" ]; then\n \
        \ TRACK=\"${{ inputs.benchmark_track || 'asr' }}\"\nelse\n  TRACK=\"asr\"\n\
        fi\necho \"track=$TRACK\" >> $GITHUB_OUTPUT\necho \"Running benchmark track:\
        \ $TRACK\"\n"
    - name: Run benchmark with gate mode (ASR smoke)
      id: benchmark-gate-run
      run: "echo \"Running ASR benchmark in gate mode...\"\nuv run slower-whisper\
        \ benchmark run \\\n  --track asr \\\n  --dataset smoke \\\n  --gate \\\n\
        \  --threshold wer=0.10 \\\n  --threshold cer=0.05 \\\n  --output benchmark-results/asr-gate-results.json\
        \ \\\n  2>&1 | tee benchmark-results/gate-output.log\n"
      continue-on-error: ${{ github.event_name == 'pull_request' }}
    - name: Compare with baselines
      id: baseline-compare
      run: "echo \"Comparing with stored baselines...\"\nuv run slower-whisper benchmark\
        \ compare \\\n  --track asr \\\n  --dataset smoke \\\n  --output benchmark-results/comparison.json\
        \ \\\n  2>&1 | tee -a benchmark-results/gate-output.log\n"
      continue-on-error: true
    - name: Generate gate summary
      if: always()
      run: "echo \"## Benchmark Gate Summary\" > benchmark-results/GATE_SUMMARY.md\n\
        echo \"\" >> benchmark-results/GATE_SUMMARY.md\necho \"**Run Date:** $(date\
        \ -Iseconds)\" >> benchmark-results/GATE_SUMMARY.md\necho \"**Commit:** ${{\
        \ github.sha }}\" >> benchmark-results/GATE_SUMMARY.md\necho \"**Trigger:**\
        \ ${{ github.event_name }}\" >> benchmark-results/GATE_SUMMARY.md\necho \"\
        **Track:** ${{ steps.track.outputs.track }}\" >> benchmark-results/GATE_SUMMARY.md\n\
        echo \"\" >> benchmark-results/GATE_SUMMARY.md\n\nif [ \"${{ steps.benchmark-gate-run.outcome\
        \ }}\" == \"success\" ]; then\n  echo \"### Result: \u2705 PASSED\" >> benchmark-results/GATE_SUMMARY.md\n\
        \  echo \"All benchmarks within regression thresholds.\" >> benchmark-results/GATE_SUMMARY.md\n\
        else\n  echo \"### Result: \u26A0\uFE0F ATTENTION NEEDED\" >> benchmark-results/GATE_SUMMARY.md\n\
        \  echo \"Benchmark may have regressed or had issues. Review output below.\"\
        \ >> benchmark-results/GATE_SUMMARY.md\nfi\n\necho \"\" >> benchmark-results/GATE_SUMMARY.md\n\
        echo \"### Output Log\" >> benchmark-results/GATE_SUMMARY.md\necho '```' >>\
        \ benchmark-results/GATE_SUMMARY.md\ncat benchmark-results/gate-output.log\
        \ 2>/dev/null || echo \"No output log available\"\necho '```' >> benchmark-results/GATE_SUMMARY.md\n\
        \ncat benchmark-results/GATE_SUMMARY.md\n"
    - name: Save benchmark cache
      if: always()
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: '~/.cache/huggingface

          benchmarks/.cache

          '
        key: benchmark-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
    - name: Upload gate results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: benchmark-gate-results
        path: benchmark-results/
        retention-days: 90
    - name: Fail on regression (scheduled runs only)
      if: github.event_name == 'schedule' && steps.benchmark-gate-run.outcome == 'failure'
      run: 'echo "::error::Benchmark regression detected in scheduled run!"

        exit 1

        '
  diarization-nightly:
    name: Diarization smoke (real pyannote)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python
      run: uv python install 3.12
    - name: Install system dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg libsndfile1

        '
    - name: Install dependencies with diarization extras
      run: uv sync --extra diarization --extra dev
    - name: Restore HuggingFace cache
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/huggingface
        key: hf-diarization-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: 'hf-diarization-${{ runner.os }}-

          hf-${{ runner.os }}-

          '
    - name: Run diarization evaluation (real pyannote)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: "uv run python benchmarks/eval_diarization.py \\\n  --dataset benchmarks/data/diarization\
        \ \\\n  --manifest benchmarks/data/diarization/manifest.jsonl \\\n  --device\
        \ cpu \\\n  --output-json diarization-results.json \\\n  --overwrite\n"
    - name: Validate diarization results
      run: "uv run python -c \"\nimport json, sys\ndata = json.load(open('diarization-results.json'))\n\
        agg = data.get('aggregate', {})\n\navg_der = float(agg.get('avg_der', 999))\n\
        speaker_acc = float(agg.get('speaker_count_accuracy', 0))\nnum_samples = int(agg.get('num_samples',\
        \ 0))\n\nerrors = []\nif num_samples < 1:\n    errors.append(f'num_samples\
        \ too low: {num_samples}')\nif avg_der > 1.0:\n    errors.append(f'avg_der\
        \ too high: {avg_der:.4f}')\nif speaker_acc < 0.5:\n    errors.append(f'speaker_count_accuracy\
        \ too low: {speaker_acc:.3f}')\n\nif errors:\n    for e in errors:\n     \
        \   print(f'FAIL: {e}', file=sys.stderr)\n    sys.exit(1)\n\nprint(f'OK: avg_der={avg_der:.4f},\
        \ speaker_acc={speaker_acc:.3f}, samples={num_samples}')\n\"\n"
    - name: Save HuggingFace cache
      if: always()
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/huggingface
        key: hf-diarization-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    needs:
    - lint
    - format
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Set up Python
      run: uv python install 3.12
    - name: Install docs dependencies
      run: uv sync --extra docs --no-dev
    - name: Build documentation
      run: ./scripts/docs-build.sh --strict
    - name: Upload documentation
      uses: actions/upload-artifact@v6
      with:
        name: docs-html
        path: docs/_build/html/
        retention-days: 14
  ci-success:
    name: CI Success
    if: always()
    needs:
    - lint
    - format
    - type-check
    - wheel-smoke
    - test
    - test-smoke
    - test-integration
    - bdd-library
    - bdd-api
    - benchmark
    - security-scan
    - docs
    runs-on: ubuntu-latest
    steps:
    - name: Check all jobs
      run: "if [[ \"${{ needs.lint.result }}\" == \"failure\" ]] || \\\n   [[ \"${{\
        \ needs.format.result }}\" == \"failure\" ]] || \\\n   [[ \"${{ needs.type-check.result\
        \ }}\" == \"failure\" ]] || \\\n   [[ \"${{ needs.wheel-smoke.result }}\"\
        \ == \"failure\" ]] || \\\n   [[ \"${{ needs.test.result }}\" == \"failure\"\
        \ ]] || \\\n   [[ \"${{ needs.test-smoke.result }}\" == \"failure\" ]] ||\
        \ \\\n   [[ \"${{ needs.test-integration.result }}\" == \"failure\" ]] ||\
        \ \\\n   [[ \"${{ needs.bdd-library.result }}\" == \"failure\" ]] || \\\n\
        \   [[ \"${{ needs.bdd-api.result }}\" == \"failure\" ]] || \\\n   [[ \"${{\
        \ needs.docs.result }}\" == \"failure\" ]]; then\n  echo \"One or more required\
        \ jobs failed\"\n  exit 1\nfi\n\n# Report benchmark status (informational\
        \ only for PR, gated for schedule)\necho \"\"\nif [[ \"${{ needs.benchmark.result\
        \ }}\" == \"failure\" ]]; then\n  echo \"\u26A0\uFE0F Benchmark smoke test\
        \ had issues (informational only)\"\nelif [[ \"${{ needs.benchmark.result\
        \ }}\" == \"success\" ]]; then\n  echo \"\u2705 Benchmark smoke test passed\"\
        \nelse\n  echo \"\u2139\uFE0F Benchmark smoke test: ${{ needs.benchmark.result\
        \ }}\"\nfi\n\n# Report security scan status (informational)\nif [[ \"${{ needs.security-scan.result\
        \ }}\" == \"failure\" ]]; then\n  echo \"\u26A0\uFE0F Security scan had issues\
        \ (informational)\"\nelif [[ \"${{ needs.security-scan.result }}\" == \"success\"\
        \ ]]; then\n  echo \"\u2705 Security scan passed\"\nelse\n  echo \"\u2139\uFE0F\
        \ Security scan: ${{ needs.security-scan.result }}\"\nfi\n\necho \"\"\necho\
        \ \"All required jobs passed!\"\necho \"\"\necho \"\u2705 Lint passed\"\n\
        echo \"\u2705 Format check passed\"\necho \"\u2705 Type check passed\"\necho\
        \ \"\u2705 Wheel smoke test passed\"\necho \"\u2705 Unit tests passed\"\n\
        echo \"\u2705 Smoke tests passed (real tiny model)\"\necho \"\u2705 Integration\
        \ tests passed\"\necho \"\u2705 Library BDD contract enforced\"\necho \"\u2705\
        \ API BDD contract enforced\"\necho \"\u2705 Documentation builds cleanly\"\
        \necho \"\"\necho \"Note: Benchmark gate mode runs on schedule (weekly) and\
        \ manual trigger.\"\necho \"      Use workflow_dispatch with benchmark_gate=true\
        \ to test gate mode.\"\n"
