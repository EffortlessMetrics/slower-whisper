name: Show Surface Parity Format 634

on:
  pull_request:
    branches: [main]
    paths:
      - transcription/api.py
      - transcription/service_runtime_transcribe.py
      - transcription/service_serialization.py
      - transcription/source_identity.py
      - transcription/transcription_orchestrator.py
      - tests/test_service_source_identity.py
      - tests/test_surface_parity.py
      - .github/workflows/show-surface-parity-format-634.yml

permissions:
  contents: read

concurrency:
  group: show-surface-parity-format-634-${{ github.ref }}
  cancel-in-progress: true

jobs:
  show-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Print exact repository formatter diff
        run: |
          uvx ruff@0.14.14 format --diff \
            transcription/api.py \
            transcription/service_runtime_transcribe.py \
            transcription/service_serialization.py \
            transcription/source_identity.py \
            transcription/transcription_orchestrator.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
