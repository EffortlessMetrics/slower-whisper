name: Repair REST Source Identity Parity

on:
  push:
    branches: [feature/surface-parity-620]

permissions:
  contents: write

concurrency:
  group: repair-rest-source-identity-parity
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact parity branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/surface-parity-620
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve caller identity without trusting its path
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path("transcription/service_runtime_transcribe.py")
          source = route_path.read_text(encoding="utf-8")

          source = source.replace(
              "from pathlib import Path\n",
              "from pathlib import Path, PurePosixPath\n",
              1,
          )

          suffix_helper = '''def _safe_audio_suffix(filename: str | None) -> str:
              if not filename:
                  return ""
              suffix = Path(filename).suffix.lower()
              return suffix if suffix in _ALLOWED_AUDIO_SUFFIXES else ""
          '''
          source_helper = '''def _safe_audio_suffix(filename: str | None) -> str:
              if not filename:
                  return ""
              suffix = Path(filename).suffix.lower()
              return suffix if suffix in _ALLOWED_AUDIO_SUFFIXES else ""


          def _safe_source_name(
              filename: str | None,
              *,
              fallback_suffix: str = "",
          ) -> str:
              """Return a bounded response identity without trusting path components."""
              fallback = f"audio{fallback_suffix}"
              if not filename:
                  return fallback

              normalized = filename.replace("\\\\", "/")
              name = PurePosixPath(normalized).name
              name = "".join(
                  character
                  for character in name
                  if character >= " " and character != "\\x7f"
              ).strip()
              if name in {"", ".", ".."}:
                  return fallback
              if len(name) <= 255:
                  return name

              suffix = Path(name).suffix
              stem_limit = max(1, 255 - len(suffix))
              return f"{Path(name).stem[:stem_limit]}{suffix}"
          '''
          if "def _safe_source_name(" not in source:
              assert source.count(suffix_helper) == 1, "audio suffix helper changed"
              source = source.replace(suffix_helper, source_helper, 1)

          temp_anchor = '''    with tempfile.TemporaryDirectory() as tmpdir:
              tmpdir_path = Path(tmpdir)
              audio_path = tmpdir_path / (
                  f"audio_{secrets.token_hex(16)}{_safe_audio_suffix(audio.filename)}"
              )
          '''
          temp_replacement = '''    audio_suffix = _safe_audio_suffix(audio.filename)
              source_name = _safe_source_name(
                  audio.filename,
                  fallback_suffix=audio_suffix,
              )

              with tempfile.TemporaryDirectory() as tmpdir:
                  tmpdir_path = Path(tmpdir)
                  audio_path = tmpdir_path / (
                      f"audio_{secrets.token_hex(16)}{audio_suffix}"
                  )
          '''
          if "source_name = _safe_source_name(" not in source:
              assert source.count(temp_anchor) == 1, "temporary upload block changed"
              source = source.replace(temp_anchor, temp_replacement, 1)

          response_anchor = '''        return JSONResponse(
              content=_transcript_to_dict(
          '''
          response_replacement = '''        transcript.file_name = source_name
              transcript.meta = dict(transcript.meta or {})
              transcript.meta["audio_file"] = source_name

              return JSONResponse(
                  content=_transcript_to_dict(
          '''
          if 'transcript.meta["audio_file"] = source_name' not in source:
              assert source.count(response_anchor) == 1, "REST response block changed"
              source = source.replace(response_anchor, response_replacement, 1)

          route_path.write_text(source, encoding="utf-8")

          parity_path = Path("tests/test_surface_parity.py")
          parity = parity_path.read_text(encoding="utf-8")
          projection_anchor = '''        "file": document["file"],
              "language": document["language"],
          '''
          projection_replacement = '''        "file": document["file"],
              "audio_file": meta["audio_file"],
              "language": document["language"],
          '''
          if '"audio_file": meta["audio_file"]' not in parity:
              assert parity.count(projection_anchor) == 1, "semantic projection changed"
              parity = parity.replace(
                  projection_anchor,
                  projection_replacement,
                  1,
              )
          parity_path.write_text(parity, encoding="utf-8")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked environment
        run: uv sync --frozen --python 3.12 --extra dev --extra api

      - name: Format and verify the repaired ownership seam
        run: |
          uv run ruff check --fix \
            transcription/service_runtime_transcribe.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
          uv run ruff format \
            transcription/service_runtime_transcribe.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
          uv run ruff check \
            transcription/service_runtime_transcribe.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
          uv run ruff format --check \
            transcription/service_runtime_transcribe.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
          uv run pytest -q \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py \
            tests/test_service_runtime_transcribe.py
          git diff --check

      - name: Remove one-shot workflow and commit accepted repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/repair-rest-source-identity-parity.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "fix: preserve safe REST source identity across surfaces"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feature/surface-parity-620
