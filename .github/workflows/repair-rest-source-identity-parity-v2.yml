name: Repair REST Source Identity Parity v2

on:
  push:
    branches: [feature/surface-parity-620]

permissions:
  contents: write

concurrency:
  group: repair-rest-source-identity-parity-v2
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact parity branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/surface-parity-620
          fetch-depth: 0
          persist-credentials: false

      - name: Patch the public source-identity boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path("transcription/service_runtime_transcribe.py")
          source = route_path.read_text(encoding="utf-8")

          if "from pathlib import Path, PurePosixPath\n" not in source:
              old_import = "from pathlib import Path\n"
              assert source.count(old_import) == 1, "Path import changed"
              source = source.replace(
                  old_import,
                  "from pathlib import Path, PurePosixPath\n",
                  1,
              )

          if "def _safe_source_name(" not in source:
              decorator = "\n\n@router.post(\n"
              insert_at = source.index(decorator)
              helper = (
                  "\n\ndef _safe_source_name(\n"
                  "    filename: str | None,\n"
                  "    *,\n"
                  "    fallback_suffix: str = \"\",\n"
                  ") -> str:\n"
                  "    \"\"\"Return a bounded response identity without trusting path components.\"\"\"\n"
                  "    fallback = f\"audio{fallback_suffix}\"\n"
                  "    if not filename:\n"
                  "        return fallback\n"
                  "\n"
                  "    normalized = filename.replace(\"\\\\\", \"/\")\n"
                  "    name = PurePosixPath(normalized).name\n"
                  "    name = \"\".join(\n"
                  "        character\n"
                  "        for character in name\n"
                  "        if character >= \" \" and character != \"\\x7f\"\n"
                  "    ).strip()\n"
                  "    if name in {\"\", \".\", \"..\"}:\n"
                  "        return fallback\n"
                  "    if len(name) <= 255:\n"
                  "        return name\n"
                  "\n"
                  "    suffix = Path(name).suffix\n"
                  "    stem_limit = max(1, 255 - len(suffix))\n"
                  "    return f\"{Path(name).stem[:stem_limit]}{suffix}\"\n"
              )
              source = source[:insert_at] + helper + source[insert_at:]

          if "source_name = _safe_source_name(" not in source:
              old_upload = (
                  "    with tempfile.TemporaryDirectory() as tmpdir:\n"
                  "        tmpdir_path = Path(tmpdir)\n"
                  "        audio_path = tmpdir_path / (\n"
                  "            f\"audio_{secrets.token_hex(16)}"
                  "{_safe_audio_suffix(audio.filename)}\"\n"
                  "        )\n"
              )
              new_upload = (
                  "    audio_suffix = _safe_audio_suffix(audio.filename)\n"
                  "    source_name = _safe_source_name(\n"
                  "        audio.filename,\n"
                  "        fallback_suffix=audio_suffix,\n"
                  "    )\n"
                  "\n"
                  "    with tempfile.TemporaryDirectory() as tmpdir:\n"
                  "        tmpdir_path = Path(tmpdir)\n"
                  "        audio_path = tmpdir_path / (\n"
                  "            f\"audio_{secrets.token_hex(16)}{audio_suffix}\"\n"
                  "        )\n"
              )
              assert source.count(old_upload) == 1, "temporary upload block changed"
              source = source.replace(old_upload, new_upload, 1)

          if 'transcript.meta["audio_file"] = source_name' not in source:
              return_marker = "\n        return JSONResponse(\n"
              insert_at = source.rindex(return_marker)
              restoration = (
                  "\n        transcript.file_name = source_name\n"
                  "        transcript.meta = dict(transcript.meta or {})\n"
                  "        transcript.meta[\"audio_file\"] = source_name\n"
              )
              source = source[:insert_at] + restoration + source[insert_at:]

          route_path.write_text(source, encoding="utf-8")

          parity_path = Path("tests/test_surface_parity.py")
          parity = parity_path.read_text(encoding="utf-8")
          if '"audio_file": meta["audio_file"]' not in parity:
              old_projection = '        "file": document["file"],\n'
              assert parity.count(old_projection) == 1, "file projection changed"
              parity = parity.replace(
                  old_projection,
                  old_projection + '        "audio_file": meta["audio_file"],\n',
                  1,
              )
          parity_path.write_text(parity, encoding="utf-8")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked environment
        run: uv sync --frozen --python 3.12 --extra dev --extra api

      - name: Format and verify the repaired ownership seam
        run: |
          uv run ruff check --fix \
            transcription/service_runtime_transcribe.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
          uv run ruff format \
            transcription/service_runtime_transcribe.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
          uv run ruff check \
            transcription/service_runtime_transcribe.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
          uv run ruff format --check \
            transcription/service_runtime_transcribe.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
          uv run pytest -q \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py \
            tests/test_service_runtime_transcribe.py
          git diff --check

      - name: Remove repair workflows and commit accepted repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f \
            .github/workflows/repair-rest-source-identity-parity.yml \
            .github/workflows/repair-rest-source-identity-parity-v2.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "fix: preserve safe REST source identity across surfaces"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feature/surface-parity-620
