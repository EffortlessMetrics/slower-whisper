                  "output validation block",
              ),
              (
                  '''            text = text.strip()
            self._last_hypothesis_text = text
''',
                  '''            text = raw_text.strip()
            self._last_hypothesis_text = text
''',
                  "text normalization block",
              ),
              (
                  '''        self._segment_number = 0

        self._model_calls = 0
''',
                  '''        self._segment_number = 0
        self._seen_segment_ids: set[str] = set()

        self._model_calls = 0
''',
                  "segment identity state",
              ),
              (
                  '''        segment_id = self._segment_id_factory(self._segment_number)
        if not segment_id:
