name: Finalize Incremental ASR 84

on:
  push:
    branches: [feature/incremental-asr-84]

permissions:
  contents: write

concurrency:
  group: finalize-incremental-asr-84
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout incremental-ASR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/incremental-asr-84
          fetch-depth: 0

      - name: Preserve output validation, identity, and failed-session bounds
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("transcription/incremental_asr.py")
          source = path.read_text(encoding="utf-8")

          replacements = (
              (
                  '''    ) -> str | Awaitable[str]: ...
''',
