      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python 3.12 and 3.13
        run: uv python install 3.12 3.13

      - name: Install complete Python 3.12 environment
        run: uv sync --python 3.12 --extra dev

      - name: Apply canonical formatting and verify strict contracts
        run: |
          uv run ruff check --fix \
            transcription/incremental_asr.py \
            tests/test_incremental_asr.py
          uv run ruff format \
            transcription/incremental_asr.py \
            tests/test_incremental_asr.py
          uv run ruff check \
            transcription/incremental_asr.py \
            tests/test_incremental_asr.py
          uv run ruff format --check \
            transcription/incremental_asr.py \
            tests/test_incremental_asr.py
          uv run mypy transcription/incremental_asr.py
          git diff --check

      - name: Verify focused revision semantics
        run: uv run pytest -q tests/test_incremental_asr.py

      - name: Verify full non-heavy suite
        run: |
          uv run pytest -q \
            -m "not slow and not heavy and not requires_gpu" \
            --no-cov

      - name: Verify installed core on Python 3.12 and 3.13
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel
          WHEEL=$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")
          test -n "$WHEEL"
          for version in 3.12 3.13; do
            VENV="$RUNNER_TEMP/incremental-asr-$version"
            uv venv "$VENV" --python "$version"
            uv pip install --python "$VENV/bin/python" "$WHEEL"
            uv pip check --python "$VENV/bin/python"
            (
              cd "$RUNNER_TEMP"
              unset PYTHONPATH
              "$VENV/bin/python" - <<'PY'
          import asyncio
          from pathlib import Path

          import transcription.incremental_asr as module
          from transcription.incremental_asr import IncrementalASRConfig, IncrementalASRSession

          assert "site-packages" in Path(module.__file__).resolve().parts

          def pcm(samples: int) -> bytes:
              return b"\x01\x00" * samples

          class Backend:
              def __init__(self):
                  self.calls = []
              def transcribe(self, data, *, sample_rate, start_sample, end_sample):
                  assert sample_rate == 16000
                  samples = len(data) // 2
                  self.calls.append((samples, start_sample, end_sample))
                  return f"samples:{samples}"

          async def main():
              backend = Backend()
              session = IncrementalASRSession(
                  backend,
                  config=IncrementalASRConfig(
                      min_hypothesis_samples=4,
                      hypothesis_interval_samples=4,
                      max_utterance_samples=12,
                      max_chunk_bytes=64,
                  ),
              )
              revisions = []
              for _ in range(8):
                  revisions.extend(await session.push_pcm(pcm(1), speech=True))
              revisions.extend(await session.end())
              assert [(r.revision, r.end_sample, r.final) for r in revisions] == [
                  (1, 4, False),
                  (2, 8, False),
                  (3, 8, True),
              ]
              assert backend.calls == [(4, 0, 4), (8, 0, 8)]

          asyncio.run(main())
          PY
            )
          done

      - name: Remove one-shot workflow and commit accepted source candidate
        run: |
          rm .github/workflows/finalize-incremental-asr-84.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "streaming: finalize revision-aware incremental ASR core"
          git push origin HEAD:feature/incremental-asr-84
