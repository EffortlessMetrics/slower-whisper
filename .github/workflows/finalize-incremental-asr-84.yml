          for old, new, description in replacements:
              if new in source:
                  continue
              assert source.count(old) == 1, f"{description} changed"
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")

          tests_path = Path("tests/test_incremental_asr.py")
          tests = tests_path.read_text(encoding="utf-8")
          failure_anchor = '''    assert "provider detail" not in str(exc_info.value.public_details())
