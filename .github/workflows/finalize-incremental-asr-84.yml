name: Finalize Incremental ASR 84

on:
  push:
    branches: [feature/incremental-asr-84]

permissions:
  contents: write

concurrency:
  group: finalize-incremental-asr-84
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout incremental-ASR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/incremental-asr-84
          fetch-depth: 0

      - name: Preserve runtime output validation under strict typing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("transcription/incremental_asr.py")
          source = path.read_text(encoding="utf-8")

          protocol_old = '''    ) -> str | Awaitable[str]: ...
'''
          protocol_new = '''    ) -> object | Awaitable[object]: ...
'''
          if protocol_new not in source:
              assert source.count(protocol_old) == 1, "backend protocol return changed"
              source = source.replace(protocol_old, protocol_new, 1)

          cache_old = '''        reuse_cached_text = (
            final_reason is not None
            and active_samples == self._last_hypothesis_samples
            and self._last_hypothesis_text is not None
        )

        if reuse_cached_text:
            text = self._last_hypothesis_text
        else:
'''
          cache_new = '''        cached_text = self._last_hypothesis_text
        reuse_cached_text = (
            final_reason is not None
            and active_samples == self._last_hypothesis_samples
            and cached_text is not None
        )

        if reuse_cached_text:
            text = cached_text
        else:
'''
          if cache_new not in source:
              assert source.count(cache_old) == 1, "cached-text block changed"
              source = source.replace(cache_old, cache_new, 1)

          result_old = '''                text = await result if inspect.isawaitable(result) else result
'''
          result_new = '''                raw_text = await result if inspect.isawaitable(result) else result
'''
          if result_new not in source:
              assert source.count(result_old) == 1, "backend result assignment changed"
              source = source.replace(result_old, result_new, 1)

          validation_old = '''            if not isinstance(text, str):
                output_error = ASROutputError(
'''
          validation_new = '''            if not isinstance(raw_text, str):
                output_error = ASROutputError(
'''
          if validation_new not in source:
              assert source.count(validation_old) == 1, "output validation block changed"
              source = source.replace(validation_old, validation_new, 1)

          strip_old = '''            text = text.strip()
            self._last_hypothesis_text = text
'''
          strip_new = '''            text = raw_text.strip()
            self._last_hypothesis_text = text
'''
          if strip_new not in source:
              assert source.count(strip_old) == 1, "text normalization block changed"
              source = source.replace(strip_old, strip_new, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python 3.12 and 3.13
        run: uv python install 3.12 3.13

      - name: Install complete Python 3.12 environment
        run: uv sync --python 3.12 --extra dev

      - name: Apply canonical formatting and verify strict contracts
        run: |
          uv run ruff check --fix \
            transcription/incremental_asr.py \
            tests/test_incremental_asr.py
          uv run ruff format \
            transcription/incremental_asr.py \
            tests/test_incremental_asr.py
          uv run ruff check \
            transcription/incremental_asr.py \
            tests/test_incremental_asr.py
          uv run ruff format --check \
            transcription/incremental_asr.py \
            tests/test_incremental_asr.py
          uv run mypy transcription/incremental_asr.py
          git diff --check

      - name: Verify focused revision semantics
        run: uv run pytest -q tests/test_incremental_asr.py

      - name: Verify full non-heavy suite
        run: |
          uv run pytest -q \
            -m "not slow and not heavy and not requires_gpu" \
            --no-cov

      - name: Verify installed core on Python 3.12 and 3.13
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel
          WHEEL=$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")
          test -n "$WHEEL"
          for version in 3.12 3.13; do
            VENV="$RUNNER_TEMP/incremental-asr-$version"
            uv venv "$VENV" --python "$version"
            uv pip install --python "$VENV/bin/python" "$WHEEL"
            uv pip check --python "$VENV/bin/python"
            (
              cd "$RUNNER_TEMP"
              unset PYTHONPATH
              "$VENV/bin/python" - <<'PY'
          import asyncio
          from pathlib import Path

          import transcription.incremental_asr as module
          from transcription.incremental_asr import IncrementalASRConfig, IncrementalASRSession

          assert "site-packages" in Path(module.__file__).resolve().parts

          def pcm(samples: int) -> bytes:
              return b"\x01\x00" * samples

          class Backend:
              def __init__(self):
                  self.calls = []
              def transcribe(self, data, *, sample_rate, start_sample, end_sample):
                  assert sample_rate == 16000
                  samples = len(data) // 2
                  self.calls.append((samples, start_sample, end_sample))
                  return f"samples:{samples}"

          async def main():
              backend = Backend()
              session = IncrementalASRSession(
                  backend,
                  config=IncrementalASRConfig(
                      min_hypothesis_samples=4,
                      hypothesis_interval_samples=4,
                      max_utterance_samples=12,
                      max_chunk_bytes=64,
                  ),
              )
              revisions = []
              for _ in range(8):
                  revisions.extend(await session.push_pcm(pcm(1), speech=True))
              revisions.extend(await session.end())
              assert [(r.revision, r.end_sample, r.final) for r in revisions] == [
                  (1, 4, False),
                  (2, 8, False),
                  (3, 8, True),
              ]
              assert backend.calls == [(4, 0, 4), (8, 0, 8)]

          asyncio.run(main())
          PY
            )
          done

      - name: Remove one-shot workflow and commit accepted source candidate
        run: |
          rm .github/workflows/finalize-incremental-asr-84.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "streaming: finalize revision-aware incremental ASR core"
          git push origin HEAD:feature/incremental-asr-84
