name: Format Incremental ASR 84

on:
  push:
    branches: [feature/incremental-asr-84]

permissions:
  contents: write

concurrency:
  group: format-incremental-asr-84
  cancel-in-progress: true

jobs:
  format-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/incremental-asr-84
          fetch-depth: 0
          persist-credentials: false

      - name: Use the locked development environment in the durable gate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/incremental-asr-contract.yml")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          marker = "      - name: Install focused test environment\n"
          start = lines.index(marker)
          end = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index].startswith("      - name:")
          )
          expression = "$" + "{{ matrix.python-version }}"
          replacement = [
              marker,
              f"        run: uv sync --python {expression} --extra dev\n",
              "\n",
          ]
          lines[start:end] = replacement
          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked development environment
        run: uv sync --python 3.12 --extra dev

      - name: Apply and verify canonical source formatting
        run: |
          uv run ruff format \
            transcription/incremental_asr.py \
            tests/test_incremental_asr.py
          uv run ruff check \
            transcription/incremental_asr.py \
            tests/test_incremental_asr.py
          uv run ruff format --check \
            transcription/incremental_asr.py \
            tests/test_incremental_asr.py
          uv run mypy transcription/incremental_asr.py
          uv run pytest -q tests/test_incremental_asr.py
          git diff --check

      - name: Commit only the formatted accepted candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/format-incremental-asr-84.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "streaming: finalize revision-aware incremental ASR core"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feature/incremental-asr-84
