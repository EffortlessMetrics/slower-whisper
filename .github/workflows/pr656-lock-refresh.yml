name: PR 656 Lock Refresh

on:
  push:
    branches:
      - fix/643-installed-public-surface-20261002

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Refresh and commit uv.lock
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          git diff --check
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv lock"
          git push origin HEAD:"$GITHUB_REF_NAME"
