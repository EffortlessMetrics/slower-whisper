name: Apply Runtime Lifecycle Patch

on:
  push:
    branches: [fix/runtime-lifecycle-623]

permissions:
  contents: write

concurrency:
  group: apply-runtime-lifecycle-623
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/runtime-lifecycle-623
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Apply bounded runtime patch
        run: |
          python scripts/patch_runtime_623.py
          uvx ruff@0.14.9 format \
            transcription/_build_info.py \
            transcription/api.py \
            transcription/exceptions.py \
            transcription/meta_utils.py \
            transcription/receipt.py \
            transcription/service.py \
            transcription/service_errors.py \
            transcription/service_health.py \
            transcription/service_runtime.py \
            transcription/service_serialization.py \
            transcription/service_transcribe.py \
            transcription/transcription_orchestrator.py \
            tests/conftest.py \
            tests/test_api_service.py \
            tests/test_security_leak.py \
            tests/test_service.py \
            tests/test_service_health.py \
            tests/test_service_lifecycle.py \
            tests/test_service_runtime.py
          uvx ruff@0.14.9 check \
            transcription/_build_info.py \
            transcription/api.py \
            transcription/exceptions.py \
            transcription/meta_utils.py \
            transcription/receipt.py \
            transcription/service.py \
            transcription/service_errors.py \
            transcription/service_health.py \
            transcription/service_runtime.py \
            transcription/service_serialization.py \
            transcription/service_transcribe.py \
            transcription/transcription_orchestrator.py \
            tests/conftest.py \
            tests/test_api_service.py \
            tests/test_security_leak.py \
            tests/test_service.py \
            tests/test_service_health.py \
            tests/test_service_lifecycle.py \
            tests/test_service_runtime.py
          git diff --check

      - name: Restore canonical workflow and commit
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci-nix.yml > .github/workflows/ci-nix.yml
          rm scripts/patch_runtime_623.py
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "runtime: own service ASR lifecycle and provenance"
          git push origin HEAD:fix/runtime-lifecycle-623
