name: Diagnose PR 622 Test Failures

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: diagnose-pr-622-tests
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.number == 622
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v6
        with:
          ref: fix/asr-fail-closed-621
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.12

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install test dependencies
        run: uv sync --extra dev

      - name: Record first broad-suite failures
        shell: bash
        run: |
          set +e
          uv run pytest \
            -vv \
            --tb=long \
            --maxfail=8 \
            -m "not slow and not heavy and not smoke and not e2e" \
            -n auto \
            2>&1 | tee test-failure-report.txt
          status=${PIPESTATUS[0]}
          printf '\npytest_exit_status=%s\n' "$status" >> test-failure-report.txt
          exit 0

      - name: Commit diagnostic report
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -- test-failure-report.txt
          git commit -m "test: capture PR 622 broad-suite failures"
          git push origin HEAD:fix/asr-fail-closed-621
