name: Merge Surface Parity 620

on:
  push:
    branches: [automation/surface-parity-620-merge]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: merge-surface-parity-620
  cancel-in-progress: false

jobs:
  validate-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: fix/surface-parity-620

    steps:
      - name: Checkout current feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/surface-parity-620
          fetch-depth: 0
          persist-credentials: false

      - name: Reconcile the exact serialization seam
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$FEATURE_BRANCH"
          BASE_HEAD=$(git rev-parse HEAD)
          test "$BASE_HEAD" = "$(git rev-parse origin/$FEATURE_BRANCH)"
          echo "BASE_HEAD=$BASE_HEAD" >> "$GITHUB_ENV"

          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path("transcription/writers.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))
          import_line = "from .generation_receipt import ensure_generation_receipt\n"

          if import_line not in source:
              imports = [
                  node
                  for node in tree.body
                  if isinstance(node, (ast.Import, ast.ImportFrom))
              ]
              assert imports, "writers.py has no import anchor"
              insertion_line = max(node.end_lineno or node.lineno for node in imports)
              lines = source.splitlines(keepends=True)
              lines.insert(insertion_line, import_line)
              source = "".join(lines)
              tree = ast.parse(source, filename=str(path))

          functions = [
              node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == "write_json"
          ]
          assert len(functions) == 1, functions
          function = functions[0]
          assert function.args.args, "write_json has no transcript argument"
          transcript_name = function.args.args[0].arg
          statement = (
              f"    {transcript_name}.meta = "
              f"ensure_generation_receipt({transcript_name}.meta)\n"
          )
          if statement.strip() not in source:
              insertion_line = function.body[0].lineno
              first = function.body[0]
              if (
                  isinstance(first, ast.Expr)
                  and isinstance(first.value, ast.Constant)
                  and isinstance(first.value.value, str)
              ):
                  insertion_line = (first.end_lineno or first.lineno) + 1
              lines = source.splitlines(keepends=True)
              lines.insert(insertion_line - 1, statement)
              source = "".join(lines)

          ast.parse(source, filename=str(path))
          path.write_text(source, encoding="utf-8")
          PY

          rm -f .github/workflows/finalize-surface-parity-620.yml

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python 3.12 and 3.13
        run: uv python install 3.12 3.13

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install locked Python 3.12 environment
        run: uv sync --frozen --python 3.12 --extra dev --extra api

      - name: Format and verify the candidate
        run: |
          uv run ruff check --fix \
            transcription/generation_receipt.py \
            transcription/writers.py \
            tests/test_generation_receipt.py
          uv run ruff format \
            transcription/generation_receipt.py \
            transcription/writers.py \
            tests/test_generation_receipt.py
          uv run ruff check \
            transcription/generation_receipt.py \
            transcription/writers.py \
            tests/test_generation_receipt.py
          uv run ruff format --check \
            transcription/generation_receipt.py \
            transcription/writers.py \
            tests/test_generation_receipt.py
          uv run mypy \
            transcription/generation_receipt.py \
            transcription/writers.py
          uv run pytest -q \
            tests/test_generation_receipt.py \
            tests/test_meta_utils.py \
            tests/test_provenance_schema.py \
            tests/test_provenance_surfaces.py \
            tests/test_receipt.py \
            tests/test_writers.py
          uv run pytest -q \
            -m "not slow and not heavy and not requires_gpu" \
            --no-cov
          git diff --check

      - name: Verify the installed wheel on Python 3.12 and 3.13
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel
          WHEEL=$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")
          test -n "$WHEEL"
          for version in 3.12 3.13; do
            VENV="$RUNNER_TEMP/surface-parity-$version"
            uv venv "$VENV" --python "$version"
            uv pip install --python "$VENV/bin/python" "${WHEEL}[api]"
            uv pip check --python "$VENV/bin/python"
            (
              cd "$RUNNER_TEMP"
              unset PYTHONPATH
              "$VENV/bin/python" - <<'PY'
          import json
          from pathlib import Path

          import transcription.generation_receipt as module
          from transcription.models import Transcript
          from transcription.writers import write_json

          assert "site-packages" in Path(module.__file__).resolve().parts
          transcript = Transcript(
              file_name="clip.wav",
              language="en",
              segments=[],
              meta={
                  "generated_at": "2026-08-22T12:00:00Z",
                  "audio_file": "clip.wav",
                  "audio_duration_sec": 1.0,
                  "model_name": "tiny",
                  "device": "cuda",
                  "compute_type": "float16",
                  "beam_size": 5,
                  "vad_min_silence_ms": 500,
                  "language_hint": "en",
                  "task": "transcribe",
                  "pipeline_version": "2.0.2",
                  "root": "/unrelated/caller",
                  "asr_backend": "faster-whisper",
                  "asr_device": "cpu",
                  "asr_compute_type": "int8",
              },
          )
          output = Path("clip.json")
          write_json(transcript, output)
          receipt = json.loads(output.read_text(encoding="utf-8"))["meta"]["receipt"]
          assert receipt["model"] == "tiny"
          assert receipt["device"] == "cpu"
          assert receipt["compute_type"] == "int8"
          assert "/unrelated/caller" not in json.dumps(receipt)
          PY
            )
          done

      - name: Commit the accepted feature head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "metadata: complete receipts at the JSON serialization seam"
            git remote set-url origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push \
              --force-with-lease="refs/heads/${FEATURE_BRANCH}:${BASE_HEAD}" \
              origin HEAD:"${FEATURE_BRANCH}"
          fi
          echo "TESTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Resolve the feature PR
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$FEATURE_BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          test -n "$PR_NUMBER"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" = "$TESTED_HEAD"
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true

      - name: Wait for the exact PR-head contract
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 5400))
          required=(
            "surface-parity-contract (Python 3.12)"
            "surface-parity-contract (Python 3.13)"
            "surface-parity-full-suite (Python 3.12)"
            "surface-parity-installed (Python 3.12)"
            "surface-parity-installed (Python 3.13)"
          )
          while true; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" = "$TESTED_HEAD"
            checks=$(gh api -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${TESTED_HEAD}/check-runs?per_page=100")
            all_required=true
            for name in "${required[@]}"; do
              jq -e --arg name "$name" '.check_runs[] | select(.name == $name and .conclusion == "success")' \
                <<<"$checks" >/dev/null || all_required=false
            done
            failed=$(jq -r '[.check_runs[]
              | select((.name | ascii_downcase | contains("gitleaks")) | not)
              | select(.status == "completed")
              | select((.conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped") | not)]
              | length' <<<"$checks")
            test "$failed" -eq 0
            pending=$(jq -r '[.check_runs[]
              | select((.name | ascii_downcase | contains("gitleaks")) | not)
              | select(.status != "completed")] | length' <<<"$checks")
            if [ "$all_required" = true ] && [ "$pending" -eq 0 ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Merge the validated parity seam
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" = "$TESTED_HEAD"
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --subject "metadata: complete receipts at the JSON serialization seam (#${PR_NUMBER})" \
            --body "Advances #620. Generation-complete metadata now receives the canonical receipt at the shared writer, while incomplete imported metadata remains unknown. Source, full-suite, and installed-wheel parity contracts passed."

      - name: Record the merge and start the next parity lane
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r .merged <<<"$pr")" = "true"
          merge_sha=$(jq -r .merge_commit_sha <<<"$pr")
          gh issue comment 620 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Generation receipt parity merged via #${PR_NUMBER} at \`${merge_sha}\`. Complete legacy directory/CLI generation metadata can no longer lose the canonical receipt at JSON serialization; incomplete imported metadata remains deliberately unknown. The next parity lane must execute directory and CLI surfaces end to end and compare semantic transcript plus stable receipt projections, rather than inferring parity from the shared writer alone."
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/fix/directory-cli-parity-620" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/heads/fix/directory-cli-parity-620' \
              -f sha="$main_sha" >/dev/null
          fi

      - name: Delete disposable automation branch
        if: success()
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/automation/surface-parity-620-merge" || true
