name: Integrate and Merge Runtime 623

on:
  push:
    branches: [fix/runtime-lifecycle-623]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: runtime-623-authoritative-merge
  cancel-in-progress: false

jobs:
  integrate-test-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '624'

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v6
        with:
          ref: fix/runtime-lifecycle-623
          fetch-depth: 0

      - name: Integrate staged patch and remove one-shot scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          if [ -f scripts/patch_runtime_623.py ]; then
            python scripts/patch_runtime_623.py
          fi

          git checkout origin/main -- .github/workflows/ci-nix.yml
          rm -f \
            scripts/patch_runtime_623.py \
            .github/workflows/apply-runtime-623.yml \
            .github/workflows/patch-runtime-wav.yml \
            .github/workflows/runtime-623-finalize.yml \
            .github/workflows/merge-runtime-623-after-finalize.yml \
            .github/workflows/runtime-623-integrate-and-merge.yml

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/runtime-contract.yml')
          if path.exists():
              source = path.read_text(encoding='utf-8')
              source = source.replace(
                  '("silence.wav", b"fake", "audio/wav")',
                  '("silence.wav", wav_bytes, "audio/wav")',
              )
              source = source.replace(
                  '("silence-2.wav", b"fake", "audio/wav")',
                  '("silence-2.wav", wav_bytes, "audio/wav")',
              )
              if 'wav_bytes' in source and 'def silence_wav_bytes()' not in source:
                  anchor = '          class InstalledEngine:\n'
                  helper = '''          def silence_wav_bytes() -> bytes:\n              import io\n              import wave\n\n              buffer = io.BytesIO()\n              with wave.open(buffer, "wb") as wav_file:\n                  wav_file.setnchannels(1)\n                  wav_file.setsampwidth(2)\n                  wav_file.setframerate(16_000)\n                  wav_file.writeframes(b"\\x00\\x00" * 1_600)\n              return buffer.getvalue()\n\n          wav_bytes = silence_wav_bytes()\n\n          class InstalledEngine:\n'''
                  if anchor in source:
                      source = source.replace(anchor, helper, 1)
              path.write_text(source, encoding='utf-8')
          PY

          test ! -e scripts/patch_runtime_623.py
          test ! -e .github/workflows/apply-runtime-623.yml
          test -f transcription/service_runtime.py
          test -f transcription/service_runtime_transcribe.py
          test -f transcription/_build_info.py
          test -f scripts/write_build_info.py
          test -f tests/test_service_runtime.py
          test -f tests/test_service_lifecycle.py
          test -f tests/test_runtime_provenance.py
          git diff --check

      - name: Install uv and Python toolchains
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.12 and 3.13
        run: uv python install 3.12 3.13

      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.py')
          mapfile -t working < <(git diff --name-only --diff-filter=ACMR -- '*.py')
          files+=("${working[@]}")
          if [ "${#files[@]}" -ne 0 ]; then
            printf '%s\n' "${files[@]}" | sort -u | xargs uvx ruff@0.14.9 format
          fi
          git diff --check

      - name: Commit clean integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "EffortlessSteven"
            git config user.email "git@effortlesssteven.com"
            git add -A
            git commit -m "runtime: complete lifecycle and provenance integration"
            git push origin HEAD:fix/runtime-lifecycle-623
          fi

          LOCAL_HEAD=$(git rev-parse HEAD)
          PR_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)
          test "$LOCAL_HEAD" = "$PR_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.ref)" = "fix/runtime-lifecycle-623"

      - name: Install Python 3.12 test environment
        run: uv sync --python 3.12 --extra dev

      - name: Verify static contracts
        run: |
          uv run ruff check transcription/ tests/ scripts/write_build_info.py
          uv run ruff format --check transcription/ tests/ scripts/write_build_info.py
          uv run mypy \
            transcription/ \
            tests/test_llm_utils.py \
            tests/test_writers.py \
            tests/test_turn_helpers.py \
            tests/test_audio_state_schema.py
          git diff --check

      - name: Verify focused runtime contracts on Python 3.12
        run: |
          uv run pytest -q \
            tests/test_service_runtime.py \
            tests/test_service_lifecycle.py \
            tests/test_runtime_provenance.py \
            tests/test_meta_utils.py \
            tests/test_service.py \
            tests/test_api_service.py \
            tests/test_service_health.py \
            tests/test_security_leak.py \
            tests/test_asr_engine.py

      - name: Verify full non-heavy suite on Python 3.12
        run: |
          uv run pytest -q \
            -m "not slow and not heavy and not requires_gpu" \
            --no-cov

      - name: Verify runtime contracts on Python 3.13
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/runtime-623-py313"
          uv venv "$VENV" --python 3.13
          uv pip install --python "$VENV/bin/python" -e '.[dev]'
          "$VENV/bin/python" -m pytest -q \
            tests/test_service_runtime.py \
            tests/test_service_lifecycle.py \
            tests/test_runtime_provenance.py \
            tests/test_meta_utils.py \
            tests/test_service.py \
            tests/test_api_service.py \
            tests/test_service_health.py \
            tests/test_security_leak.py \
            tests/test_asr_engine.py

      - name: Build installed API artifact with embedded provenance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_build_info.py \
            --source-commit "$(git rev-parse HEAD)" \
            --build-id "runtime-623-accepted-${GITHUB_RUN_ID}"
          uv build --wheel
          VENV="$RUNNER_TEMP/runtime-623-wheel"
          uv venv "$VENV" --python 3.12
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$WHEEL"
          uv pip install --python "$VENV/bin/python" "${WHEEL}[api]"
          uv pip install --python "$VENV/bin/python" httpx
          uv pip check --python "$VENV/bin/python"
          echo "RUNTIME_WHEEL_VENV=$VENV" >> "$GITHUB_ENV"

      - name: Exercise installed service outside checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNTIME_WHEEL_VENV/bin/python" - <<'PY'
          from __future__ import annotations

          import io
          import wave
          from pathlib import Path

          from fastapi.testclient import TestClient

          from transcription.config import TranscriptionConfig
          from transcription.models import Transcript
          from transcription.service import create_app
          from transcription.service_runtime import ASRRuntime

          def silence_wav_bytes() -> bytes:
              buffer = io.BytesIO()
              with wave.open(buffer, "wb") as wav_file:
                  wav_file.setnchannels(1)
                  wav_file.setsampwidth(2)
                  wav_file.setframerate(16_000)
                  wav_file.writeframes(b"\x00\x00" * 1_600)
              return buffer.getvalue()

          class InstalledEngine:
              instances = 0

              def __init__(self, cfg):
                  type(self).instances += 1
                  self.cfg = cfg.asr
                  self.model_load_attempts = [
                      {
                          "device": self.cfg.device,
                          "compute_type": self.cfg.compute_type,
                          "outcome": "selected",
                          "reason_code": "ok",
                      }
                  ]

              def transcribe_file(self, path):
                  return Transcript(
                      file_name=Path(path).name,
                      language="en",
                      segments=[],
                      meta={
                          "asr_backend": "faster-whisper",
                          "asr_device": self.cfg.device,
                          "asr_compute_type": self.cfg.compute_type,
                          "asr_model_load_attempts": list(self.model_load_attempts),
                      },
                  )

          async def runtime_factory():
              runtime = ASRRuntime(
                  TranscriptionConfig(),
                  engine_factory=InstalledEngine,
              )
              await runtime.start()
              return runtime

          wav_bytes = silence_wav_bytes()
          app = create_app(runtime_factory=runtime_factory)
          with TestClient(app) as client:
              live = client.get("/health/live")
              assert live.status_code == 200, live.text
              ready = client.get("/health/ready")
              assert ready.status_code == 200, ready.text
              assert ready.json()["runtime"]["state"] == "ready"

              first = client.post(
                  "/transcribe",
                  files={"file": ("silence.wav", wav_bytes, "audio/wav")},
              )
              assert first.status_code == 200, first.text
              payload = first.json()
              assert payload["segments"] == []
              receipt = payload["meta"]["receipt"]
              assert receipt["source_commit"]
              assert receipt["build_id"].startswith("runtime-623-accepted-")
              assert receipt["device"] == "cpu"
              assert receipt["compute_type"] == "int8"

              second = client.post(
                  "/transcribe",
                  files={"file": ("silence-2.wav", wav_bytes, "audio/wav")},
              )
              assert second.status_code == 200, second.text
              assert InstalledEngine.instances == 1
          PY

      - name: Verify merge diff and complete squash merge
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- transcription/_build_info.py
          git diff --check
          test ! -e .github/workflows/runtime-623-integrate-and-merge.yml
          test ! -e .github/workflows/runtime-623-finalize.yml
          test ! -e .github/workflows/merge-runtime-623-after-finalize.yml
          test ! -e scripts/patch_runtime_623.py

          LOCAL_HEAD=$(git rev-parse HEAD)
          PR_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)
          test "$LOCAL_HEAD" = "$PR_HEAD"

          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --subject "runtime: own ASR lifecycle, readiness, and provenance (#624)" \
            --body "Closes #623. Advances #620 from fail-closed batch ASR to a service-owned runtime with truthful readiness, embedded build provenance, automatic receipts, typed REST failure mapping, and installed-artifact acceptance."
