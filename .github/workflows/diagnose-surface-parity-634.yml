name: Diagnose Surface Parity 634

on:
  pull_request:
    branches: [main]
    paths:
      - transcription/api.py
      - transcription/service_runtime_transcribe.py
      - transcription/service_serialization.py
      - transcription/source_identity.py
      - transcription/transcription_orchestrator.py
      - tests/test_service_source_identity.py
      - tests/test_surface_parity.py
      - .github/workflows/diagnose-surface-parity-634.yml

permissions:
  contents: read

concurrency:
  group: diagnose-surface-parity-634-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12 --extra dev --extra api
      - name: Ruff check
        run: |
          uv run ruff check \
            transcription/api.py \
            transcription/service_runtime_transcribe.py \
            transcription/service_serialization.py \
            transcription/source_identity.py \
            transcription/transcription_orchestrator.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
      - name: Ruff format
        run: |
          uv run ruff format --check \
            transcription/api.py \
            transcription/service_runtime_transcribe.py \
            transcription/service_serialization.py \
            transcription/source_identity.py \
            transcription/transcription_orchestrator.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
      - name: Diff hygiene
        run: git diff --check

  focused-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv python install 3.12
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
      - run: uv sync --frozen --python 3.12 --extra dev --extra api
      - run: |
          uv run pytest -q --maxfail=1 --tb=short \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py

  api-and-service:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv python install 3.12
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
      - run: uv sync --frozen --python 3.12 --extra dev --extra api
      - run: |
          files=(tests/test_api.py tests/test_service.py tests/test_service_runtime_transcribe.py)
          test -f tests/test_service_serialization.py && files+=(tests/test_service_serialization.py)
          uv run pytest -q --maxfail=1 --tb=short "${files[@]}"

  provenance-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv python install 3.12
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
      - run: uv sync --frozen --python 3.12 --extra dev --extra api
      - run: |
          uv run pytest -q --maxfail=1 --tb=short \
            tests/test_meta_utils.py \
            tests/test_provenance_schema.py \
            tests/test_provenance_surfaces.py \
            tests/test_receipt.py \
            tests/test_incremental_asr.py

  full-non-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv python install 3.12
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
      - run: uv sync --frozen --python 3.12 --extra dev --extra api
      - name: Run full non-heavy suite and print only the decisive tail
        shell: bash
        run: |
          set +e
          uv run pytest -q --maxfail=1 --tb=short \
            -m "not slow and not heavy and not requires_gpu" \
            --no-cov \
            > "$RUNNER_TEMP/full-non-heavy.log" 2>&1
          status=$?
          tail -n 300 "$RUNNER_TEMP/full-non-heavy.log"
          exit "$status"
