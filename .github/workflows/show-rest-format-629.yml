name: Show REST Format 629

on:
  push:
    branches: [fix/rest-runtime-reuse-623]

permissions:
  contents: read

concurrency:
  group: show-rest-format-629
  cancel-in-progress: false

jobs:
  show-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/rest-runtime-reuse-623
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Show canonical Ruff diff
        run: uvx ruff@0.14.14 format --diff transcription/service_runtime_transcribe.py
