name: Show Incremental ASR Format 84

on:
  pull_request:
    branches: [main]
    paths:
      - transcription/incremental_asr.py
      - tests/test_incremental_asr.py
      - .github/workflows/show-incremental-format-84.yml

permissions:
  contents: read

jobs:
  show-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Print canonical Ruff diff
        run: |
          uvx ruff@0.14.14 format --diff \
            transcription/incremental_asr.py \
            tests/test_incremental_asr.py
