name: Show WebSocket Real ASR Format

on:
  pull_request:
    branches: [main]
    paths:
      - transcription/service_runtime_streaming.py
      - transcription/streaming_revision_controller.py
      - tests/test_public_streaming_real_asr.py
      - tests/test_streaming_revision_controller.py
      - tests/test_websocket_real_asr_source_policy.py
      - .github/workflows/show-websocket-real-asr-format.yml

permissions:
  contents: read

concurrency:
  group: show-websocket-real-asr-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  show-format:
    name: show-websocket-real-asr-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Print canonical formatter diff
        run: |
          uvx ruff@0.14.14 format --diff \
            transcription/service_runtime_streaming.py \
            transcription/streaming_revision_controller.py \
            tests/test_public_streaming_real_asr.py \
            tests/test_streaming_revision_controller.py \
            tests/test_websocket_real_asr_source_policy.py
