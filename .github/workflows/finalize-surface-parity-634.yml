name: Finalize Surface Parity 634

on:
  push:
    branches: [feature/surface-parity-620]

permissions:
  contents: write

concurrency:
  group: finalize-surface-parity-634
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact parity branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/surface-parity-620
          fetch-depth: 0
          persist-credentials: false

      - name: Repair the owning source, lifecycle, and serialization paths
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if new in source:
                  return source
              assert source.count(old) == 1, f"{label} changed"
              return source.replace(old, new, 1)

          api_path = Path("transcription/api.py")
          api = api_path.read_text(encoding="utf-8")
          api = replace_once(
              api,
              "from .models import Transcript\n",
              "from .models import Transcript\nfrom .source_identity import safe_source_name\n",
              "API source-identity import",
          )
          api = replace_once(
              api,
              '''    suffix = Path(file_name).suffix
    format_hint = suffix.lstrip(".").lower() if suffix else "wav"
''',
              '''    source_name = safe_source_name(file_name, fallback_suffix=".wav")
    suffix = Path(source_name).suffix
    format_hint = suffix.lstrip(".").lower() if suffix else "wav"
''',
              "bytes source-name setup",
          )
          api = replace_once(
              api,
              '''    transcript.file_name = file_name
    return transcript
''',
              '''    transcript.file_name = source_name
    transcript.meta = dict(transcript.meta or {})
    transcript.meta["audio_file"] = source_name
    return transcript
''',
              "bytes public identity restoration",
          )
          api_path.write_text(api, encoding="utf-8")

          orchestrator_path = Path("transcription/transcription_orchestrator.py")
          orchestrator = orchestrator_path.read_text(encoding="utf-8")
          orchestrator = replace_once(
              orchestrator,
              '''    temp_file = None
    norm_temp = None
    try:
''',
              '''    temp_file = None
    norm_temp = None
    engine: TranscriptionEngine | None = None
    try:
''',
              "bytes engine ownership",
          )
          orchestrator = replace_once(
              orchestrator,
              '''    finally:
        if temp_file is not None:
''',
              '''    finally:
        if engine is not None:
            close = getattr(engine, "close", None)
            if callable(close):
                try:
                    close()
                except Exception as cleanup_exc:
                    logger.debug(
                        "Failed to close bytes transcription engine: %s",
                        cleanup_exc,
                    )
        if temp_file is not None:
''',
              "bytes engine cleanup",
          )
          orchestrator_path.write_text(orchestrator, encoding="utf-8")

          route_path = Path("transcription/service_runtime_transcribe.py")
          route = route_path.read_text(encoding="utf-8")
          route = replace_once(
              route,
              "from .service_settings import HTTP_413_TOO_LARGE, MAX_AUDIO_SIZE_MB\n",
              "from .service_settings import HTTP_413_TOO_LARGE, MAX_AUDIO_SIZE_MB\nfrom .source_identity import safe_source_name\n",
              "REST source-identity import",
          )
          route = replace_once(
              route,
              '''    with tempfile.TemporaryDirectory() as tmpdir:
        tmpdir_path = Path(tmpdir)
        audio_path = tmpdir_path / (
            f"audio_{secrets.token_hex(16)}{_safe_audio_suffix(audio.filename)}"
        )
''',
              '''    audio_suffix = _safe_audio_suffix(audio.filename)
    source_name = safe_source_name(
        audio.filename,
        fallback_suffix=audio_suffix,
    )

    with tempfile.TemporaryDirectory() as tmpdir:
        tmpdir_path = Path(tmpdir)
        audio_path = tmpdir_path / (
            f"audio_{secrets.token_hex(16)}{audio_suffix}"
        )
''',
              "REST temporary upload boundary",
          )
          route = replace_once(
              route,
              '''        return JSONResponse(
            content=_transcript_to_dict(
''',
              '''        transcript.file_name = source_name
        transcript.meta = dict(transcript.meta or {})
        transcript.meta["audio_file"] = source_name

        return JSONResponse(
            content=_transcript_to_dict(
''',
              "REST public identity restoration",
          )
          route_path.write_text(route, encoding="utf-8")

          serialization_path = Path("transcription/service_serialization.py")
          serialization = serialization_path.read_text(encoding="utf-8")
          serialization = replace_once(
              serialization,
              "from .models import SCHEMA_VERSION, Transcript\n",
              "from .models import SCHEMA_VERSION, Transcript\nfrom .writers import _to_dict\n",
              "canonical serializer import",
          )
          serialization = replace_once(
              serialization,
              '''        "file_name": transcript.file_name,
''',
              '''        "file": transcript.file_name,
        "file_name": transcript.file_name,
''',
              "canonical REST file key",
          )
          serialization = replace_once(
              serialization,
              '''    # Include optional diarization fields when present (v1.1+)
    if transcript.speakers is not None:
        data["speakers"] = transcript.speakers
    if transcript.turns is not None:
        data["turns"] = transcript.turns

    return data
''',
              '''    # Include optional canonical transcript fields when present.
    if transcript.annotations is not None:
        data["annotations"] = transcript.annotations
    if transcript.speakers is not None:
        data["speakers"] = transcript.speakers
    if transcript.turns is not None:
        data["turns"] = [_to_dict(turn) for turn in transcript.turns]
    if transcript.speaker_stats is not None:
        data["speaker_stats"] = [
            _to_dict(stats) for stats in transcript.speaker_stats
        ]
    if transcript.chunks is not None:
        data["chunks"] = [_to_dict(chunk) for chunk in transcript.chunks]

    return data
''',
              "complete REST transcript serialization",
          )
          serialization_path.write_text(serialization, encoding="utf-8")

          source_test_path = Path("tests/test_service_source_identity.py")
          source_test = source_test_path.read_text(encoding="utf-8")
          source_test = source_test.replace(
              "from transcription.service_runtime_transcribe import _safe_source_name\n",
              "from transcription.source_identity import safe_source_name\n",
          )
          source_test = source_test.replace("_safe_source_name(", "safe_source_name(")
          source_test_path.write_text(source_test, encoding="utf-8")

          parity_path = Path("tests/test_surface_parity.py")
          parity = parity_path.read_text(encoding="utf-8")
          parity = replace_once(
              parity,
              "from transcription.service_runtime import ASRRuntime, RuntimeProfile  # noqa: E402\n",
              "from transcription.service_runtime import ASRRuntime, RuntimeProfile  # noqa: E402\nfrom transcription.service_serialization import _transcript_to_dict  # noqa: E402\n",
              "parity serializer import",
          )
          parity = replace_once(
              parity,
              '''        "file": document["file"],
        "language": document["language"],
''',
              '''        "file": document["file"],
        "audio_file": meta["audio_file"],
        "language": document["language"],
''',
              "public source identity projection",
          )
          parity = replace_once(
              parity,
              '''def transcript_document(transcript: Transcript) -> dict[str, Any]:
    return transcript.to_dict()
''',
              '''def transcript_document(transcript: Transcript) -> dict[str, Any]:
    return _transcript_to_dict(transcript, include_words=False)
''',
              "canonical transcript serialization",
          )
          parity = replace_once(
              parity,
              '''    assert response.status_code == 200, response.text

    documents = [
''',
              '''    assert response.status_code == 200, response.text
    assert response.json()["file"] == "surface.wav"
    assert response.json()["file_name"] == "surface.wav"
    assert response.json()["meta"]["audio_file"] == "surface.wav"

    documents = [
''',
              "REST canonical identity assertions",
          )
          parity_path.write_text(parity, encoding="utf-8")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python
        run: uv python install 3.12

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install locked test environment
        run: uv sync --frozen --python 3.12 --extra dev --extra api

      - name: Apply canonical formatting and static checks
        run: |
          uv run ruff check --fix \
            transcription/api.py \
            transcription/service_runtime_transcribe.py \
            transcription/service_serialization.py \
            transcription/source_identity.py \
            transcription/transcription_orchestrator.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
          uv run ruff format \
            transcription/api.py \
            transcription/service_runtime_transcribe.py \
            transcription/service_serialization.py \
            transcription/source_identity.py \
            transcription/transcription_orchestrator.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
          uv run ruff check \
            transcription/api.py \
            transcription/service_runtime_transcribe.py \
            transcription/service_serialization.py \
            transcription/source_identity.py \
            transcription/transcription_orchestrator.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
          uv run ruff format --check \
            transcription/api.py \
            transcription/service_runtime_transcribe.py \
            transcription/service_serialization.py \
            transcription/source_identity.py \
            transcription/transcription_orchestrator.py \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py
          uv run mypy \
            transcription/api.py \
            transcription/service_runtime_transcribe.py \
            transcription/service_serialization.py \
            transcription/source_identity.py \
            transcription/transcription_orchestrator.py
          git diff --check

      - name: Verify parity, lifecycle, schema, and adjacent contracts
        run: |
          uv run pytest -q \
            tests/test_service_source_identity.py \
            tests/test_surface_parity.py \
            tests/test_api.py \
            tests/test_service_runtime_transcribe.py \
            tests/test_service.py \
            tests/test_meta_utils.py \
            tests/test_provenance_schema.py

      - name: Verify full non-heavy repository suite
        run: |
          uv run pytest -q \
            -m "not slow and not heavy and not requires_gpu" \
            --no-cov

      - name: Remove one-shot finalizer and commit accepted candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/finalize-surface-parity-634.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "runtime: align file bytes and REST transcript identity"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feature/surface-parity-620
