name: ASR Truth

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/asr-fail-closed-621]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-silent-contract:
    name: repair PR 622 silent-audio assertions
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/fix/asr-fail-closed-621'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v6
        with:
          ref: fix/asr-fail-closed-621
          fetch-depth: 0

      - name: Replace stale non-empty assertions with real-ASR receipts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_diarization_skeleton.py")
          source = path.read_text(encoding="utf-8")

          anchor = '''# ============================================================================
# Existing integration tests
# ============================================================================


'''
          helper = '''# ============================================================================
# Existing integration tests
# ============================================================================


def _assert_selected_real_asr(transcript: Transcript) -> None:
    """Assert that silent audio was processed by a selected real backend."""
    meta = transcript.meta or {}
    assert meta.get("asr_backend") == "faster-whisper"
    attempts = meta.get("asr_model_load_attempts")
    assert isinstance(attempts, list) and attempts
    assert any(attempt.get("outcome") == "selected" for attempt in attempts)
    assert "asr_placeholder_segments" not in meta
    assert "asr_fallback_reason" not in meta


'''
          assert source.count(anchor) == 1, "integration-test anchor changed unexpectedly"
          source = source.replace(anchor, helper, 1)

          enabled_old = '''    # Verify transcript structure
    assert isinstance(transcript, Transcript)
    assert len(transcript.segments) > 0

    # Verify diarization behavior:
'''
          enabled_new = '''    # Silence is a valid empty transcript; prove that real ASR ran instead.
    assert isinstance(transcript, Transcript)
    _assert_selected_real_asr(transcript)

    # Verify diarization behavior:
'''
          assert source.count(enabled_old) == 1, "enabled assertion changed unexpectedly"
          source = source.replace(enabled_old, enabled_new, 1)

          disabled_old = '''    # Should complete normally
    assert isinstance(transcript, Transcript)
    assert len(transcript.segments) > 0

    assert transcript.speakers is None
'''
          disabled_new = '''    # Should complete normally; silence may legitimately produce no segments.
    assert isinstance(transcript, Transcript)
    _assert_selected_real_asr(transcript)

    assert transcript.speakers is None
'''
          assert source.count(disabled_old) == 1, "disabled assertion changed unexpectedly"
          source = source.replace(disabled_old, disabled_new, 1)
          path.write_text(source, encoding="utf-8")
          PY

          git fetch origin main
          git show origin/main:.github/workflows/ci-nix.yml > .github/workflows/ci-nix.yml
          rm -f test-failure-report.txt
          python -m pip install --quiet ruff==0.14.9
          ruff format tests/test_diarization_skeleton.py
          ruff check tests/test_diarization_skeleton.py
          git diff --check

      - name: Commit repaired acceptance contract
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A -- \
            .github/workflows/ci-nix.yml \
            tests/test_diarization_skeleton.py \
            test-failure-report.txt
          git commit -m "test: accept real empty transcripts for silent audio"
          git push origin HEAD:fix/asr-fail-closed-621

  asr-truth:
    name: asr-truth (source + installed wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.12

      - name: Install base ASR test environment
        run: |
          uv sync
          uv pip install --python .venv/bin/python pytest

      - name: Show canonical formatting diff
        run: |
          uvx ruff@0.14.9 format --diff \
            transcription/asr_engine.py \
            tests/test_asr_engine.py \
            tests/test_smoke_asr.py

      - name: Verify source truth contract
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_asr_engine.py \
            tests/test_asr_truth_policy.py

      - name: Build and install wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          VENV="$RUNNER_TEMP/asr-truth-wheel"
          uv venv "$VENV" --python 3.12
          uv pip install --python "$VENV/bin/python" dist/*.whl
          uv pip check --python "$VENV/bin/python"
          echo "ASR_TRUTH_VENV=$VENV" >> "$GITHUB_ENV"

      - name: Exercise installed ASR contract outside checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          unset PYTHONPATH

          "$ASR_TRUTH_VENV/bin/python" - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace

          import transcription.asr_engine as module
          from transcription.asr_engine import TranscriptionEngine
          from transcription.config import AsrConfig
          from transcription.exceptions import (
              ASRInferenceError,
              ASRModelLoadError,
              ASROutputError,
              ASRUnavailableError,
          )

          module_path = Path(module.__file__).resolve()
          assert "site-packages" in module_path.parts, module_path
          source = module_path.read_text(encoding="utf-8")
          assert "DummyWhisperModel" not in source
          assert "dummy segment" not in source

          original_available = module._FASTER_WHISPER_AVAILABLE
          original_model = module.WhisperModel
          original_import_error = module._FASTER_WHISPER_IMPORT_ERROR
          try:
              module._FASTER_WHISPER_AVAILABLE = False
              module.WhisperModel = None
              module._FASTER_WHISPER_IMPORT_ERROR = ImportError("local detail")
              try:
                  TranscriptionEngine(
                      AsrConfig(
                          model_name="tiny",
                          device="cpu",
                          compute_type="int8",
                      )
                  )
              except ASRUnavailableError as exc:
                  assert exc.reason_code == "asr_backend_unavailable"
                  assert "local detail" not in str(exc.public_details())
              else:
                  raise AssertionError("missing backend returned success")
          finally:
              module._FASTER_WHISPER_AVAILABLE = original_available
              module.WhisperModel = original_model
              module._FASTER_WHISPER_IMPORT_ERROR = original_import_error

          def cfg(device="cpu", compute_type="int8"):
              return AsrConfig(
                  model_name="tiny",
                  device=device,
                  compute_type=compute_type,
              )

          def audio(name):
              path = Path(name)
              path.write_bytes(b"injected backends do not read audio")
              return path

          class SilenceModel:
              def transcribe(self, _path, **_kwargs):
                  return [], SimpleNamespace(language="en")

          silence = TranscriptionEngine(
              cfg(),
              backend_factory=lambda *_args: SilenceModel(),
          ).transcribe_file(audio("silence.wav"))
          assert silence.segments == []
          assert silence.meta["asr_backend"] == "faster-whisper"

          class BrokenModel:
              def transcribe(self, _path, **_kwargs):
                  raise RuntimeError("provider detail")

          try:
              TranscriptionEngine(
                  cfg(),
                  backend_factory=lambda *_args: BrokenModel(),
              ).transcribe_file(audio("broken.wav"))
          except ASRInferenceError as exc:
              assert exc.reason_code == "asr_inference_failed"
          else:
              raise AssertionError("inference failure returned success")

          class InvalidModel:
              def transcribe(self, _path, **_kwargs):
                  bad = SimpleNamespace(start=1.0, end=0.0, text="bad")
                  return [bad], SimpleNamespace(language="en")

          try:
              TranscriptionEngine(
                  cfg(),
                  backend_factory=lambda *_args: InvalidModel(),
              ).transcribe_file(audio("invalid.wav"))
          except ASROutputError as exc:
              assert exc.context["violation"] == "end_before_start"
          else:
              raise AssertionError("invalid output returned success")

          def load_failure(_model, device, compute_type, _root):
              raise RuntimeError(f"provider detail {device}/{compute_type}")

          try:
              TranscriptionEngine(
                  cfg("cuda", "float16"),
                  backend_factory=load_failure,
              )
          except ASRModelLoadError as exc:
              assert len(exc.context["attempts"]) == 2
              assert "provider detail" not in str(exc.public_details())
          else:
              raise AssertionError("model load failure returned success")
          PY
