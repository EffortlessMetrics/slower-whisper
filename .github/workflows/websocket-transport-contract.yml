name: WebSocket Transport Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  websocket-transport:
    name: websocket-transport (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install focused transport environment
        run: uv sync --frozen --python ${{ matrix.python-version }} --extra dev --extra api

      - name: Verify static transport ownership
        run: |
          uv run ruff check \
            transcription/exceptions.py \
            transcription/service_runtime_streaming.py \
            transcription/streaming_transport.py \
            tests/test_streaming_transport.py
          uv run ruff format --check \
            transcription/exceptions.py \
            transcription/service_runtime_streaming.py \
            transcription/streaming_transport.py \
            tests/test_streaming_transport.py
          uv run mypy \
            transcription/service_runtime_streaming.py \
            transcription/streaming_transport.py
          git diff --check

      - name: Verify bounded delivery, replay, and route behavior
        run: |
          uv run pytest -q \
            tests/test_streaming_transport.py \
            tests/test_public_streaming_real_asr.py \
            tests/test_streaming_revision_controller.py \
            tests/test_streaming_revision_edges.py \
            tests/test_websocket_real_asr_source_policy.py

  websocket-transport-installed:
    name: websocket-transport-installed (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Build and install API wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel
          VENV="$RUNNER_TEMP/websocket-transport-${{ matrix.python-version }}"
          uv venv "$VENV" --python ${{ matrix.python-version }}
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$WHEEL"
          uv pip install --python "$VENV/bin/python" "${WHEEL}[api]"
          uv pip install --python "$VENV/bin/python" pytest httpx
          uv pip check --python "$VENV/bin/python"
          echo "TRANSPORT_VENV=$VENV" >> "$GITHUB_ENV"

      - name: Exercise installed public route outside checkout
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$RUNNER_TEMP/websocket-transport-tests-${{ matrix.python-version }}"
          mkdir -p "$TEST_ROOT"
          cp tests/test_public_streaming_real_asr.py "$TEST_ROOT/"
          cd "$TEST_ROOT"
          unset PYTHONPATH
          "$TRANSPORT_VENV/bin/python" -m pytest -q \
            test_public_streaming_real_asr.py
