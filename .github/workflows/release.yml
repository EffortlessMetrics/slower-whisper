name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional label for manual TestPyPI runs (e.g., 2.0.2-rc1)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test before release
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install build dependencies
        run: uv pip install build twine

      - name: Embed trusted release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_ID="release-${GITHUB_REF_NAME#v}"
          else
            BUILD_ID="testpypi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          python scripts/write_build_info.py \
            --source-commit "$GITHUB_SHA" \
            --build-id "$BUILD_ID"
          echo "EXPECTED_SOURCE_COMMIT=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          echo "EXPECTED_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

      - name: Build package
        run: uv build

      - name: Check both release artifacts and embedded identity outside checkout
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist/
          uv run twine check dist/*
          WHEEL=$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")
          SDIST=$(realpath "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)")
          test -n "$WHEEL"
          test -n "$SDIST"

          for artifact in wheel sdist; do
            if [[ "$artifact" == "wheel" ]]; then
              TARGET="$WHEEL"
            else
              TARGET="$SDIST"
            fi
            VENV="$RUNNER_TEMP/release-artifact-$artifact"
            uv venv "$VENV" --python 3.12
            uv pip install --python "$VENV/bin/python" "$TARGET"
            uv pip check --python "$VENV/bin/python"
            (
              cd "$RUNNER_TEMP"
              unset PYTHONPATH
              "$VENV/bin/python" - <<'PY'
          import os
          from pathlib import Path

          import transcription
          from transcription.build_info import get_package_build_info

          package_path = Path(transcription.__file__).resolve()
          assert "site-packages" in package_path.parts, package_path
          info = get_package_build_info()
          assert info.source_commit == os.environ["EXPECTED_SOURCE_COMMIT"]
          assert info.build_id == os.environ["EXPECTED_BUILD_ID"]
          PY
            )
          done

      - name: Store distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/slower-whisper
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/slower-whisper

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: Create GitHub Release
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          cat > CHANGELOG.md << EOF
          ## What's Changed

          ${COMMITS}

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...v${{ steps.get_version.outputs.version }}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          body_path: CHANGELOG.md
          files: dist/*
          draft: false
          prerelease: false
