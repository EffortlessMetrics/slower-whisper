name: Show WebSocket Format Ruff 0.14.9

on:
  pull_request:
    branches: [main]
    paths:
      - transcription/service_runtime_streaming.py
      - transcription/streaming_revision_controller.py
      - tests/test_websocket_streaming.py
      - .github/workflows/show-websocket-format-ruff0149.yml

permissions:
  contents: read

concurrency:
  group: show-websocket-format-ruff0149-${{ github.ref }}
  cancel-in-progress: true

jobs:
  show-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Print exact repository formatter diff
        run: |
          uvx ruff@0.14.9 format --diff \
            transcription/service_runtime_streaming.py \
            transcription/streaming_revision_controller.py \
            tests/test_websocket_streaming.py
