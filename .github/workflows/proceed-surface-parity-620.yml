name: Proceed Surface Parity 620

on:
  push:
    branches: [automation/proceed-surface-parity-620-20260822]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: proceed-surface-parity-620-20260822
  cancel-in-progress: false

jobs:
  proceed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: fix/surface-parity-620

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the exact feature PR
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$FEATURE_BRANCH" \
            --state all \
            --limit 20 \
            --json number,state,mergedAt,headRefOid,baseRefName \
            --jq 'sort_by(.number) | last // empty')
          test -n "$pr"
          test "$(jq -r .baseRefName <<<"$pr")" = main
          echo "PR_NUMBER=$(jq -r .number <<<"$pr")" >> "$GITHUB_ENV"
          echo "PR_MERGED=$(jq -r '(.mergedAt != null)' <<<"$pr")" >> "$GITHUB_ENV"
          echo "ORIGINAL_HEAD=$(jq -r .headRefOid <<<"$pr")" >> "$GITHUB_ENV"

      - name: Checkout the unmerged candidate
        if: env.PR_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$FEATURE_BRANCH" --prune
          git switch -C "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"
          test "$(git rev-parse HEAD)" = "$ORIGINAL_HEAD"

      - name: Reconcile the writer seam and remove temporary automation
        if: env.PR_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          required = [
              Path("transcription/generation_receipt.py"),
              Path("tests/test_generation_receipt.py"),
              Path(".github/workflows/surface-parity-contract.yml"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          assert not missing, f"missing parity candidate files: {missing}"

          path = Path("transcription/writers.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))
          import_line = "from .generation_receipt import ensure_generation_receipt\n"
          if import_line not in source:
              imports = [
                  node
                  for node in tree.body
                  if isinstance(node, (ast.Import, ast.ImportFrom))
              ]
              assert imports
              insertion_line = max(node.end_lineno or node.lineno for node in imports)
              lines = source.splitlines(keepends=True)
              lines.insert(insertion_line, import_line)
              source = "".join(lines)
              tree = ast.parse(source, filename=str(path))

          functions = [
              node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == "write_json"
          ]
          assert len(functions) == 1
          function = functions[0]
          transcript_name = function.args.args[0].arg
          statement = (
              f"    {transcript_name}.meta = "
              f"ensure_generation_receipt({transcript_name}.meta)\n"
          )
          if statement.strip() not in source:
              first = function.body[0]
              insertion_line = first.lineno
              if (
                  isinstance(first, ast.Expr)
                  and isinstance(first.value, ast.Constant)
                  and isinstance(first.value.value, str)
              ):
                  insertion_line = (first.end_lineno or first.lineno) + 1
              lines = source.splitlines(keepends=True)
              lines.insert(insertion_line - 1, statement)
              source = "".join(lines)

          ast.parse(source, filename=str(path))
          path.write_text(source, encoding="utf-8")
          PY
          rm -f \
            .github/workflows/finalize-surface-parity-620.yml \
            .github/workflows/repair-rest-source-identity-parity.yml \
            .github/workflows/repair-rest-source-identity-parity-v2.yml

      - name: Install uv
        if: env.PR_MERGED != 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python 3.12 and 3.13
        if: env.PR_MERGED != 'true'
        run: uv python install 3.12 3.13

      - name: Install system dependencies
        if: env.PR_MERGED != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install locked test environment
        if: env.PR_MERGED != 'true'
        run: uv sync --frozen --python 3.12 --extra dev --extra api

      - name: Verify source, full suite, and installed artifacts
        if: env.PR_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --fix \
            transcription/generation_receipt.py \
            transcription/writers.py \
            tests/test_generation_receipt.py
          uv run ruff format \
            transcription/generation_receipt.py \
            transcription/writers.py \
            tests/test_generation_receipt.py
          uv run ruff check \
            transcription/generation_receipt.py \
            transcription/writers.py \
            tests/test_generation_receipt.py
          uv run ruff format --check \
            transcription/generation_receipt.py \
            transcription/writers.py \
            tests/test_generation_receipt.py
          uv run mypy \
            transcription/generation_receipt.py \
            transcription/writers.py
          uv run pytest -q \
            tests/test_generation_receipt.py \
            tests/test_meta_utils.py \
            tests/test_provenance_schema.py \
            tests/test_provenance_surfaces.py \
            tests/test_receipt.py \
            tests/test_writers.py
          uv run pytest -q \
            -m "not slow and not heavy and not requires_gpu" \
            --no-cov
          git diff --check

          rm -rf dist
          uv build --wheel
          wheel=$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")
          test -n "$wheel"
          for version in 3.12 3.13; do
            venv="$RUNNER_TEMP/surface-parity-$version"
            uv venv "$venv" --python "$version"
            uv pip install --python "$venv/bin/python" "${wheel}[api]"
            uv pip check --python "$venv/bin/python"
            (
              cd "$RUNNER_TEMP"
              unset PYTHONPATH
              "$venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          import transcription.generation_receipt as module
          from transcription.models import Transcript
          from transcription.writers import write_json

          assert "site-packages" in Path(module.__file__).resolve().parts
          transcript = Transcript(
              file_name="clip.wav",
              language="en",
              segments=[],
              meta={
                  "generated_at": "2026-08-22T12:00:00Z",
                  "audio_file": "clip.wav",
                  "audio_duration_sec": 1.0,
                  "model_name": "tiny",
                  "device": "cuda",
                  "compute_type": "float16",
                  "beam_size": 5,
                  "vad_min_silence_ms": 500,
                  "language_hint": "en",
                  "task": "transcribe",
                  "pipeline_version": "2.0.2",
                  "root": "/unrelated/caller",
                  "asr_backend": "faster-whisper",
                  "asr_device": "cpu",
                  "asr_compute_type": "int8",
              },
          )
          output = Path("clip.json")
          write_json(transcript, output)
          receipt = json.loads(output.read_text(encoding="utf-8"))["meta"]["receipt"]
          assert receipt["model"] == "tiny"
          assert receipt["device"] == "cpu"
          assert receipt["compute_type"] == "int8"
          assert "/unrelated/caller" not in json.dumps(receipt)
          PY
            )
          done

      - name: Push the exact tested feature head
        if: env.PR_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "metadata: complete receipts at the JSON serialization seam"
            git remote set-url origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push \
              --force-with-lease="refs/heads/${FEATURE_BRANCH}:${ORIGINAL_HEAD}" \
              origin HEAD:"$FEATURE_BRANCH"
          fi
          echo "TESTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for durable exact-head checks
        if: env.PR_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
          deadline=$((SECONDS + 7200))
          required=(
            "surface-parity-contract (Python 3.12)"
            "surface-parity-contract (Python 3.13)"
            "surface-parity-full-suite (Python 3.12)"
            "surface-parity-installed (Python 3.12)"
            "surface-parity-installed (Python 3.13)"
          )
          while true; do
            current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)
            test "$current" = "$TESTED_HEAD"
            checks=$(gh api -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${TESTED_HEAD}/check-runs?per_page=100")
            complete=true
            for name in "${required[@]}"; do
              jq -e --arg name "$name" \
                '.check_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")' \
                <<<"$checks" >/dev/null || complete=false
            done
            failures=$(jq -r '[.check_runs[]
              | select((.name | ascii_downcase | contains("gitleaks")) | not)
              | select(.status == "completed")
              | select((.conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped") | not)]
              | length' <<<"$checks")
            test "$failures" -eq 0
            if [ "$complete" = true ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for parity checks"
              exit 1
            fi
            sleep 25
          done

      - name: Merge the validated receipt seam
        if: env.PR_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" = "$TESTED_HEAD"
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --subject "metadata: complete receipts at the JSON serialization seam (#${PR_NUMBER})" \
            --body "Advances #620. Generation-complete metadata now receives the canonical receipt at the shared JSON writer; incomplete imported metadata remains deliberately unknown. Source, full-suite, and installed-wheel acceptance passed."

      - name: Confirm the merge and record it
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r .merged <<<"$pr")" = true
          merge_sha=$(jq -r .merge_commit_sha <<<"$pr")
          echo "MERGE_SHA=$merge_sha" >> "$GITHUB_ENV"
          gh issue comment 620 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Generation receipt parity is merged via #${PR_NUMBER} at \`${merge_sha}\`. Complete legacy generation metadata can no longer lose the canonical receipt at JSON serialization; incomplete/imported metadata remains unknown. Directory and CLI semantic parity remains a separate execution claim."

      - name: Create a fresh directory and CLI discovery branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          next_branch=fix/directory-cli-parity-620
          open_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$next_branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            echo "NEXT_BRANCH=$next_branch" >> "$GITHUB_ENV"
            echo "NEXT_PR=$open_pr" >> "$GITHUB_ENV"
            exit 0
          fi
          git switch -C "$next_branch" origin/main
          echo "NEXT_BRANCH=$next_branch" >> "$GITHUB_ENV"

      - name: Generate entrypoint ownership evidence
        if: env.NEXT_PR == ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p contracts docs
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          import subprocess
          import tomllib
          from pathlib import Path
          from typing import Any

          root = Path.cwd()
          calls_of_interest = {
              "TranscriptionEngine",
              "build_generation_metadata",
              "normalize_all",
              "run_pipeline",
              "transcribe_bytes",
              "transcribe_file",
              "write_json",
              "write_srt",
              "write_text",
              "write_vtt",
          }

          def dotted(node: ast.AST) -> str | None:
              if isinstance(node, ast.Name):
                  return node.id
              if isinstance(node, ast.Attribute):
                  parent = dotted(node.value)
                  return f"{parent}.{node.attr}" if parent else node.attr
              return None

          records: list[dict[str, Any]] = []
          for path in sorted((root / "transcription").rglob("*.py")):
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except SyntaxError:
                  continue
              module = path.relative_to(root).with_suffix("").as_posix().replace("/", ".")
              owners: list[tuple[str, ast.FunctionDef | ast.AsyncFunctionDef]] = []
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      owners.append((node.name, node))
                  elif isinstance(node, ast.ClassDef):
                      owners.extend(
                          (f"{node.name}.{member.name}", member)
                          for member in node.body
                          if isinstance(member, (ast.FunctionDef, ast.AsyncFunctionDef))
                      )
              for symbol, node in owners:
                  calls = sorted(
                      {
                          name
                          for child in ast.walk(node)
                          if isinstance(child, ast.Call)
                          for name in [dotted(child.func)]
                          if name is not None
                      }
                  )
                  leaf_calls = {name.rsplit(".", 1)[-1] for name in calls}
                  decorators = sorted(
                      name
                      for decorator in node.decorator_list
                      for name in [dotted(decorator.func if isinstance(decorator, ast.Call) else decorator)]
                      if name is not None
                  )
                  interesting = (
                      bool(calls_of_interest.intersection(leaf_calls))
                      or symbol.rsplit(".", 1)[-1] in {"main", "run_pipeline", "transcribe", "transcribe_directory"}
                      or any(value.endswith(".command") or value.endswith(".callback") for value in decorators)
                  )
                  if not interesting:
                      continue
                  records.append(
                      {
                          "module": module,
                          "path": path.relative_to(root).as_posix(),
                          "symbol": symbol,
                          "line": node.lineno,
                          "calls": calls,
                          "decorators": decorators,
                          "constructs_engine": "TranscriptionEngine" in leaf_calls,
                          "canonical_api_calls": sorted({"transcribe_file", "transcribe_bytes", "build_generation_metadata"}.intersection(leaf_calls)),
                          "writer_calls": sorted({"write_json", "write_srt", "write_text", "write_vtt"}.intersection(leaf_calls)),
                      }
                  )

          pyproject = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          scripts = dict(sorted(pyproject.get("project", {}).get("scripts", {}).items()))

          def help_result(*args: str) -> dict[str, Any]:
              result = subprocess.run(
                  ["uv", "run", "slower-whisper", *args],
                  text=True,
                  capture_output=True,
                  check=False,
                  timeout=30,
              )
              return {"args": list(args), "returncode": result.returncode, "stdout": result.stdout, "stderr": result.stderr}

          batch = [r for r in records if "pipeline" in r["module"] or r["symbol"].rsplit(".", 1)[-1] in {"run_pipeline", "transcribe_directory"} or any(call.endswith("normalize_all") for call in r["calls"])]
          cli = [r for r in records if ".cli" in r["module"] or "cli_" in r["module"] or any(value.endswith(".command") or value.endswith(".callback") for value in r["decorators"])]
          contract = {
              "contract_version": 1,
              "project_scripts": scripts,
              "root_help": help_result("--help"),
              "transcribe_help": help_result("transcribe", "--help"),
              "batch_candidates": batch,
              "cli_candidates": cli,
          }
          (root / "contracts" / "surface_parity_entrypoints.json").write_text(json.dumps(contract, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          lines = [
              "# Directory and CLI parity discovery",
              "",
              "This generated report exposes ownership and call edges. It does **not** claim behavioral parity.",
              "",
              "## Console scripts",
              "",
              *[f"- `{name}` → `{target}`" for name, target in scripts.items()],
              "",
              "## Batch candidates",
              "",
          ]
          for record in batch:
              lines.append(f"- `{record['module']}::{record['symbol']}` — engine={record['constructs_engine']}; canonical={record['canonical_api_calls']}; writers={record['writer_calls']}")
          lines.extend(["", "## CLI candidates", ""])
          for record in cli:
              lines.append(f"- `{record['module']}::{record['symbol']}` — engine={record['constructs_engine']}; canonical={record['canonical_api_calls']}; writers={record['writer_calls']}")
          lines.extend(["", "## Transcribe help", "", "```text", contract["transcribe_help"]["stdout"].rstrip(), contract["transcribe_help"]["stderr"].rstrip(), "```", ""])
          (root / "docs" / "SURFACE_PARITY_DISCOVERY.md").write_text("\n".join(lines), encoding="utf-8")
          PY

          cat > tests/test_surface_parity_entrypoints.py <<'PY'
          """Directory and CLI parity owners must remain explicit and executable."""

          from __future__ import annotations

          import ast
          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          CONTRACT = ROOT / "contracts" / "surface_parity_entrypoints.json"


          def contract() -> dict:
              return json.loads(CONTRACT.read_text(encoding="utf-8"))


          def symbols(path: Path) -> set[str]:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              result: set[str] = set()
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      result.add(node.name)
                  elif isinstance(node, ast.ClassDef):
                      result.update(
                          f"{node.name}.{member.name}"
                          for member in node.body
                          if isinstance(member, (ast.FunctionDef, ast.AsyncFunctionDef))
                      )
              return result


          def test_installed_cli_help_and_candidates_are_present() -> None:
              data = contract()
              assert data["contract_version"] == 1
              assert "slower-whisper" in data["project_scripts"]
              assert data["root_help"]["returncode"] == 0
              assert data["transcribe_help"]["returncode"] == 0
              assert data["batch_candidates"]
              assert data["cli_candidates"]


          def test_discovered_symbols_resolve_in_live_source() -> None:
              data = contract()
              for record in [*data["batch_candidates"], *data["cli_candidates"]]:
                  path = ROOT / record["path"]
                  assert path.is_file(), record
                  assert record["symbol"] in symbols(path), record
                  assert isinstance(record["constructs_engine"], bool)
                  assert isinstance(record["canonical_api_calls"], list)
                  assert isinstance(record["writer_calls"], list)
          PY
          uv run ruff check --fix tests/test_surface_parity_entrypoints.py
          uv run ruff format tests/test_surface_parity_entrypoints.py
          uv run pytest -q tests/test_surface_parity_entrypoints.py
          git diff --check

      - name: Push and open the discovery PR
        if: env.NEXT_PR == ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            contracts/surface_parity_entrypoints.json \
            docs/SURFACE_PARITY_DISCOVERY.md \
            tests/test_surface_parity_entrypoints.py
          git commit -m "test: expose directory and CLI parity ownership"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:"$NEXT_BRANCH"
          pr_url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --head "$NEXT_BRANCH" \
            --base main \
            --draft \
            --title "test: expose directory and CLI parity ownership" \
            --body "## Ruling

This is the discovery checkpoint after the generation-receipt seam. It makes the installed console entrypoints, directory/batch owners, engine-construction seams, writer calls, and reachability to canonical metadata/API paths explicit and executable.

It does **not** claim directory or CLI behavioral parity. The next patch must run the deterministic parity fixture through the discovered public entrypoints and repair the owning path when full schema-valid transcript or stable-receipt projections diverge.

Refs #620.")
          pr_number=${pr_url##*/}
          gh issue comment 620 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Directory/CLI ownership discovery opened as #${pr_number} from merged main. It exposes the actual entrypoints and call edges without upgrading that evidence into a behavioral parity claim."

      - name: Remove this automation branch
        if: success()
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/automation/proceed-surface-parity-620-20260822" || true
