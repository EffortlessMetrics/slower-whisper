name: Patch Runtime WAV Acceptance

on:
  push:
    branches: [fix/runtime-lifecycle-623]

permissions:
  contents: write

concurrency:
  group: patch-runtime-wav
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v6
        with:
          ref: fix/runtime-lifecycle-623
          fetch-depth: 0

      - name: Replace placeholder upload bytes with a valid WAV
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in (
              ".github/workflows/runtime-contract.yml",
              ".github/workflows/runtime-623-finalize.yml",
          ):
              path = Path(filename)
              source = path.read_text(encoding="utf-8")

              if "import io\n" not in source:
                  anchor = "          from __future__ import annotations\n\n"
                  assert source.count(anchor) == 1, f"future import anchor changed in {filename}"
                  source = source.replace(anchor, anchor + "          import io\n          import wave\n", 1)

              helper_anchor = "          class InstalledEngine:\n"
              helper = '''          def silence_wav_bytes() -> bytes:\n              buffer = io.BytesIO()\n              with wave.open(buffer, "wb") as wav_file:\n                  wav_file.setnchannels(1)\n                  wav_file.setsampwidth(2)\n                  wav_file.setframerate(16_000)\n                  wav_file.writeframes(b"\\x00\\x00" * 1_600)\n              return buffer.getvalue()\n\n          wav_bytes = silence_wav_bytes()\n\n          class InstalledEngine:\n'''
              if "def silence_wav_bytes()" not in source:
                  assert source.count(helper_anchor) == 1, f"engine anchor changed in {filename}"
                  source = source.replace(helper_anchor, helper, 1)

              source = source.replace(
                  '("silence.wav", b"fake", "audio/wav")',
                  '("silence.wav", wav_bytes, "audio/wav")',
              )
              source = source.replace(
                  '("silence-2.wav", b"fake", "audio/wav")',
                  '("silence-2.wav", wav_bytes, "audio/wav")',
              )
              assert 'b"fake"' not in source, f"placeholder bytes remain in {filename}"
              path.write_text(source, encoding="utf-8")
          PY

          rm .github/workflows/patch-runtime-wav.yml
          git diff --check

      - name: Commit acceptance repair
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "test: exercise installed service with valid WAV audio"
          git push origin HEAD:fix/runtime-lifecycle-623
