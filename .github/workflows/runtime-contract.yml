name: Runtime Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-contract:
    name: runtime-contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install runtime test environment
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Lint and format contract
        run: |
          uv run ruff check transcription/ tests/
          uv run ruff format --check transcription/ tests/
          git diff --check

      - name: Type-check runtime surface
        run: |
          uv run mypy \
            transcription/ \
            tests/test_llm_utils.py \
            tests/test_writers.py \
            tests/test_turn_helpers.py \
            tests/test_audio_state_schema.py

      - name: Verify lifecycle, readiness, provenance, and REST contracts
        run: |
          uv run pytest -q \
            tests/test_service_runtime.py \
            tests/test_service_lifecycle.py \
            tests/test_runtime_provenance.py \
            tests/test_meta_utils.py \
            tests/test_service.py \
            tests/test_api_service.py \
            tests/test_service_health.py \
            tests/test_security_leak.py \
            tests/test_asr_engine.py

      - name: Run full non-heavy suite
        run: |
          uv run pytest -q \
            -m "not slow and not heavy and not requires_gpu" \
            --no-cov

      - name: Build installed API artifact
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_build_info.py \
            --source-commit "${GITHUB_SHA}" \
            --build-id "runtime-contract-${GITHUB_RUN_ID}"
          uv build --wheel
          VENV="$RUNNER_TEMP/runtime-contract-wheel"
          uv venv "$VENV" --python 3.12
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          uv pip install --python "$VENV/bin/python" "${WHEEL}[api]"
          uv pip install --python "$VENV/bin/python" httpx pytest
          uv pip check --python "$VENV/bin/python"
          echo "RUNTIME_VENV=$VENV" >> "$GITHUB_ENV"

      - name: Exercise installed runtime contract outside checkout
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNTIME_VENV/bin/python" - <<'PY'
          from __future__ import annotations

          import asyncio
          from pathlib import Path
          from types import SimpleNamespace

          from fastapi.testclient import TestClient

          from transcription.config import TranscriptionConfig
          from transcription.models import Transcript
          from transcription.service import create_app
          from transcription.service_runtime import ASRRuntime

          class InstalledEngine:
              instances = 0

              def __init__(self, cfg):
                  type(self).instances += 1
                  self.cfg = cfg.asr
                  self.model_load_attempts = [
                      {
                          "device": self.cfg.device,
                          "compute_type": self.cfg.compute_type,
                          "outcome": "selected",
                          "reason_code": "ok",
                      }
                  ]

              def transcribe_file(self, path):
                  return Transcript(
                      file_name=Path(path).name,
                      language="en",
                      segments=[],
                      meta={
                          "asr_backend": "faster-whisper",
                          "asr_device": self.cfg.device,
                          "asr_compute_type": self.cfg.compute_type,
                          "asr_model_load_attempts": list(self.model_load_attempts),
                      },
                  )

          async def runtime_factory():
              runtime = ASRRuntime(
                  TranscriptionConfig(),
                  engine_factory=InstalledEngine,
              )
              await runtime.start()
              return runtime

          app = create_app(runtime_factory=runtime_factory)
          with TestClient(app) as client:
              live = client.get("/health/live")
              assert live.status_code == 200, live.text
              ready = client.get("/health/ready")
              assert ready.status_code == 200, ready.text
              assert ready.json()["runtime"]["state"] == "ready"

              response = client.post(
                  "/transcribe",
                  files={"file": ("silence.wav", b"fake", "audio/wav")},
              )
              assert response.status_code == 200, response.text
              payload = response.json()
              assert payload["segments"] == []
              receipt = payload["meta"]["receipt"]
              assert receipt["source_commit"]
              assert receipt["build_id"].startswith("runtime-contract-")
              assert receipt["device"] == "cpu"
              assert receipt["compute_type"] == "int8"

              second = client.post(
                  "/transcribe",
                  files={"file": ("silence-2.wav", b"fake", "audio/wav")},
              )
              assert second.status_code == 200, second.text
              assert InstalledEngine.instances == 1
          PY
