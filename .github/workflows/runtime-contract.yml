name: Runtime Lifecycle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-lifecycle:
    name: runtime-lifecycle (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install focused test environment
        run: |
          uv sync --python ${{ matrix.python-version }} --extra api
          uv pip install --python .venv/bin/python \
            pytest pytest-asyncio httpx mypy ruff

      - name: Verify static runtime contract
        run: |
          uv run ruff check \
            transcription/exceptions.py \
            transcription/service.py \
            transcription/service_health.py \
            transcription/service_runtime.py \
            tests/test_service_health.py \
            tests/test_service_lifecycle.py \
            tests/test_service_runtime.py
          uv run ruff format --check \
            transcription/exceptions.py \
            transcription/service.py \
            transcription/service_health.py \
            transcription/service_runtime.py \
            tests/test_service_health.py \
            tests/test_service_lifecycle.py \
            tests/test_service_runtime.py
          uv run mypy \
            transcription/service.py \
            transcription/service_health.py \
            transcription/service_runtime.py
          git diff --check

      - name: Verify lifecycle and readiness behavior
        run: |
          uv run pytest -q \
            tests/test_service_runtime.py \
            tests/test_service_lifecycle.py \
            tests/test_service_health.py

  runtime-lifecycle-installed:
    name: runtime-lifecycle-installed
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python
        run: uv python install 3.12

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Build and install API wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          WHEEL="${wheels[0]}"
          VENV="$RUNNER_TEMP/runtime-lifecycle-wheel"
          uv venv "$VENV" --python 3.12
          uv pip install --python "$VENV/bin/python" "${WHEEL}[api]"
          uv pip install --python "$VENV/bin/python" httpx
          uv pip check --python "$VENV/bin/python"
          echo "RUNTIME_VENV=$VENV" >> "$GITHUB_ENV"

      - name: Exercise installed lifecycle outside checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          unset PYTHONPATH

          "$RUNTIME_VENV/bin/python" - <<'PY'
          from pathlib import Path

          from fastapi.testclient import TestClient

          import transcription.service as service_module
          from transcription.config import AsrConfig, TranscriptionConfig
          from transcription.models import Transcript
          from transcription.service import create_app
          from transcription.service_runtime import ASRRuntime, RuntimeProfile, RuntimeState

          service_path = Path(service_module.__file__).resolve()
          assert "site-packages" in service_path.parts, service_path

          class InstalledEngine:
              instances = 0
              closes = 0

              def __init__(self, cfg: AsrConfig) -> None:
                  type(self).instances += 1
                  self.cfg = cfg
                  self.model_load_attempts = [
                      {
                          "device": cfg.device,
                          "compute_type": cfg.compute_type,
                          "outcome": "selected",
                          "reason_code": "ok",
                      }
                  ]

              def transcribe_file(self, path: Path) -> Transcript:
                  return Transcript(file_name=path.name, language="en", segments=[])

              def close(self) -> None:
                  type(self).closes += 1

          profile = RuntimeProfile.from_config(
              TranscriptionConfig(
                  model="tiny",
                  device="cpu",
                  compute_type="int8",
              )
          )
          runtime = ASRRuntime(profile, engine_factory=InstalledEngine)
          app = create_app(runtime_factory=lambda: runtime)

          with TestClient(app) as client:
              assert client.get("/health/live").status_code == 200
              ready = client.get("/health/ready")
              assert ready.status_code == 200, ready.text
              status = ready.json()["checks"]["runtime"]
              assert status["state"] == "ready"
              assert status["selected"]["device"] == "cpu"
              assert status["selected"]["compute_type"] == "int8"
              assert status["attempts"][-1]["outcome"] == "selected"
              assert InstalledEngine.instances == 1

          assert runtime.state is RuntimeState.STOPPED
          assert InstalledEngine.closes == 1
          PY
